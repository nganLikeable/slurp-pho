<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Húp Phở</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one phone-width column; a hand-painted street sign on a mint stall wall, bowl on a steel table; the 30-dish menu is a flip-through menu book in an overlay */
  --wall:#E1F0E6; --card:#F6FBF7; --ink:#10312A; --soft:#4B6B62;
  --sign:#D7262B; --gold:#F9BE1A; --steel:#C5D2CC; --line:#10312A22;
  --paper:#FFF8E6; --paper-ink:#10312A; --paper-soft:#4B6B62;
  --display:"Bungee","Arial Black",sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --wall:#0D201C; --card:#142B26; --ink:#E4F1EA; --soft:#9DB8AF;
    --sign:#E9383D; --gold:#F9BE1A; --steel:#1D3832; --line:#E4F1EA26;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --wall:#0D201C; --card:#142B26; --ink:#E4F1EA; --soft:#9DB8AF;
  --sign:#E9383D; --gold:#F9BE1A; --steel:#1D3832; --line:#E4F1EA26;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.sign{background:var(--sign);padding:12px 16px 10px;border-radius:6px;transform:rotate(-1.2deg);align-self:flex-start;border:3px solid var(--gold)}
.sign h1{font-family:var(--display);font-weight:400;font-size:38px;line-height:1;margin:0;color:var(--gold);letter-spacing:1px}
.sign p{margin:4px 0 0;font-size:13px;font-weight:600;color:#fff}
.nav{display:flex;flex-wrap:wrap;gap:6px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lang{display:flex;flex:none;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;margin-top:4px}
.lang button{font:600 12px var(--body);padding:6px 10px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--wall)}
.lang button:focus-visible{outline:3px solid var(--sign);outline-offset:-3px}
.mtools{display:flex;align-items:center;gap:8px;flex:none}
.mtools .lang{margin-top:0}
.chip{font:600 13px var(--body);padding:7px 11px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.chip.daily{border-color:var(--sign);color:var(--sign)}
.chip.daily[aria-pressed="true"]{background:var(--sign);color:#fff}
.info{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dish{font-weight:600;font-size:18px}
.sub{font-size:13px;color:var(--soft)}
.rule{font-size:14px;margin-top:2px;text-wrap:balance}
.clock{font-family:var(--display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.table{position:relative;background:var(--steel);border-radius:14px;padding:8px 8px 14px}
/* 1v1: the opponent's row above the bowl, and the shared 3-2-1 over it */
.duelbtn{border-color:var(--sign);color:var(--sign)}
.chip:disabled,.btn:disabled{opacity:.35;cursor:default}
.duel{background:var(--card);border:1.5px solid var(--ink);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.duelhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.duelhead .me{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duelhead b{font-weight:600}
.opp{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:3px 10px;align-items:center}
.opic{grid-row:1/4}
.opic svg{display:block;width:46px;height:auto}
.oname{font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.otag{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sign);margin-left:6px}
.otime{font-family:var(--display);font-size:18px;line-height:1;font-variant-numeric:tabular-nums}
.olevel{grid-column:2/4;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.olevel i{display:block;height:100%;width:100%;background:var(--sign);transition:width .12s linear}
.ostat{grid-column:2/4;font-size:13px;color:var(--soft);min-height:18px}
.dmsg{font-size:14px;font-weight:600;text-wrap:pretty}
.dmsg:empty{display:none}
.count{position:absolute;inset:0;z-index:2;display:grid;place-items:center;pointer-events:none;font:400 88px/1 var(--display);color:var(--sign);text-shadow:0 3px 0 #FFFFFF,0 6px 14px #0004}
.count span{animation:countpop .95s ease-out both}
@keyframes countpop{from{transform:scale(1.8);opacity:0}30%{transform:scale(1);opacity:1}to{transform:scale(.92);opacity:.25}}
.dres{font-family:var(--display);font-size:18px;line-height:1.2;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.count span{animation:none}}
.table svg{display:block;width:100%;height:auto;max-width:400px;margin:0 auto;touch-action:manipulation}
.shake{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translateX(-4px)}50%{transform:translateX(4px)}100%{transform:translateX(-4px)}}
/* once the run starts the steam over the bowl rises and drifts; the bowl's own level still sets how much steam there is */
#steam path{transform-box:fill-box;transform-origin:50% 100%}
#bowl.eating #steam path{animation:hot 2.2s ease-in-out infinite}
#bowl.eating #steam path:nth-child(2){animation-delay:.7s}
#bowl.eating #steam path:nth-child(3){animation-delay:1.4s}
@media (prefers-reduced-motion:reduce){.shake,#bowl.eating #steam path{animation:none}}
.gauge{display:flex;align-items:center;gap:8px;margin:6px 8px 0;font-size:12px;font-weight:600;color:var(--ink)}
.gauge span{width:26px}
.level{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.level i{display:block;height:100%;width:100%;background:var(--gold)}
#breath{background:var(--ink)}
#breath.low{background:var(--sign)}
.msg{min-height:48px;font-weight:600;text-wrap:balance}
.msg.hot{color:var(--sign)}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 15px var(--body);padding:13px 16px;border-radius:10px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none}
.btn.main{flex:1 1 180px;background:var(--gold);color:#10312A;border-color:#10312A;font-family:var(--display);font-weight:400;font-size:18px;touch-action:none}
.btn.main.on{background:var(--sign);color:#fff}
.btn:focus-visible,.chip:focus-visible,.item:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.mic{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft)}
.meter{flex:1;height:6px;background:var(--line);border-radius:3px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;width:0;background:var(--ink)}
.meter b{position:absolute;top:0;bottom:0;width:2px;background:var(--sign);left:50%}
/* result: a card that slides up from the bottom, mobile first; centred and a little wider from 641px */
.result{position:fixed;left:10px;right:10px;bottom:10px;z-index:15;max-width:460px;margin:0 auto;max-height:calc(100% - 20px);overflow-y:auto;
  background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:18px 16px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  box-shadow:0 -6px 0 var(--gold) inset,0 16px 40px #0007;animation:sheet .45s cubic-bezier(.2,1.2,.4,1) both}
@keyframes sheet{from{transform:translateY(120%)}}
.result h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0;color:var(--ink)}
.result p{margin:0}
.result .controls{width:100%;justify-content:center}
.result .btn.main{flex:1 1 160px;font-size:16px}
.rstamp{font:400 clamp(34px,11vw,52px)/1 var(--display);letter-spacing:1px;padding:8px 18px 6px;border:4px solid currentColor;border-radius:10px;color:var(--sign);
  transform:rotate(-6deg);background:#FFFFFF;margin:4px 0 6px}
.rstamp.thump{animation:stamp .5s cubic-bezier(.3,1.7,.5,1) both}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.6);opacity:0}}
.rstamp.win{color:#B8860B;background:#FFF6D6}
.rstamp.lose{color:#4B6B62;background:#EEF3F0}
.rstamp.wait{color:var(--soft);font-size:clamp(26px,8vw,36px)}
.vs{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.vsx{font:400 14px var(--display);color:var(--soft)}
.side{display:flex;flex-direction:column;gap:2px;padding:8px 6px;border-radius:12px;border:1.5px solid var(--line);min-width:0}
.side.best{border-color:var(--gold);background:#F9BE1A33}
.side.gone{opacity:.55}
.side.gone .vsn{text-decoration:line-through}
.vsn{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vst{font:400 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.rwarn{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--sign);text-align:left}
.wicon{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sign);color:#FFFFFF;font:400 14px/1 var(--display)}
.result .bit{position:absolute;left:var(--x);top:var(--y);width:11px;height:5px;border-radius:3px;background:var(--c);pointer-events:none;animation:fly .9s cubic-bezier(.2,.7,.3,1) forwards}
/* toast: drops in at the top for warnings such as an opponent leaving */
.toast{position:fixed;top:10px;left:10px;right:10px;z-index:25;max-width:460px;margin:0 auto;display:flex;align-items:center;gap:10px;
  background:var(--sign);color:#FFFFFF;border:2px solid #10312A;border-radius:14px;padding:10px 14px;box-shadow:0 10px 24px #0006;animation:toastin .4s cubic-bezier(.2,1.3,.4,1) both,nudge .5s .4s}
.toast .wicon{background:#FFFFFF;color:var(--sign)}
.toast b{display:block;font-size:15px}
.toast span span{font-size:13px}
@keyframes toastin{from{transform:translateY(-140%)}}
@keyframes nudge{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* the opponent's row once they have left */
.opp.gone .oname{text-decoration:line-through;color:var(--soft)}
.opp.gone .olevel i{background:var(--soft)}
.opp.gone .otag{background:var(--sign);color:#FFFFFF;padding:1px 6px;border-radius:999px}
.opp.gone .ostat{color:var(--sign);font-weight:600}
.duel.alert{border-color:var(--sign);box-shadow:0 0 0 3px #D7262B33}
@media (min-width:641px){.result{bottom:20px;padding:22px 22px 16px}}
@media (prefers-reduced-motion:reduce){.result,.rstamp.thump,.toast,.result .bit{animation:none}}
.foot{font-size:12px;color:var(--soft)}
.linkbtn{font:inherit;color:var(--ink);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
/* menu book, mobile first: a phone sees one half page at a time; from 641px wide the book opens to two pages around a spine */
.menuwrap{position:fixed;inset:0;z-index:20;background:var(--wall);overflow-y:auto}
.menu{max-width:1000px;margin:0 auto;padding:12px 12px 20px;display:flex;flex-direction:column;gap:10px}
.menubar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.menubar .chip{flex:none}
.msign{padding:8px 12px 6px}
.msign h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1;margin:0;color:var(--gold);letter-spacing:1px}
.msign p{margin:3px 0 0;font-size:12px}
.menuwrap button:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
/* bookmark ribbons: one row that scrolls sideways on a phone */
.ribbons{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px;align-items:flex-start;margin-bottom:-6px}
.ribbons::-webkit-scrollbar{display:none}
.rib{flex:none;font:600 12px var(--body);border:0;cursor:pointer;padding:7px 10px 15px;background:var(--c);color:var(--t);
  clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 8px),0 100%)}
.rib:hover{transform:translateY(2px)}
.rib[aria-pressed="true"]{padding-bottom:25px}

/* the book */
.stage{padding:14px 0 6px;overflow:hidden}
.book{position:relative;display:grid;grid-template-columns:minmax(0,1fr);perspective:2400px;touch-action:pan-y;filter:drop-shadow(0 10px 14px #0004)}
.book::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:28px;transform:translateX(-50%);z-index:5;pointer-events:none;display:none;
  background:linear-gradient(90deg,#0000,#0002 35%,#0005 50%,#0002 65%,#0000)}
.page{--band:clamp(100px,30vw,150px);--mar:clamp(30px,9vw,48px);--foot:clamp(40px,11vw,64px);
  grid-row:1;grid-column:1;position:relative;display:grid;grid-template-rows:var(--band) 1fr var(--foot);visibility:hidden;overflow:hidden;
  background:var(--bg);container-type:inline-size;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin:left center;border-radius:14px}
.page.L{grid-template-columns:var(--mar) minmax(0,1fr)}
.page.R{grid-template-columns:minmax(0,1fr) var(--mar)}
.page.show{visibility:visible}
.page::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0}
.page.L::after{background:linear-gradient(270deg,#000B,#0003 70%)}
.page.R::after{background:linear-gradient(90deg,#000B,#0003 70%)}
.t-cover{--bg:#17594A;--ttl:#F9BE1A;--sub:#FFFFFF}
.t-north{--bg:#A9CF7C;--ttl:#1F3D2B;--sub:#1F3D2B}
.t-central{--bg:#63C0D1;--ttl:#0E3E55;--sub:#0E3E55}
.t-south{--bg:#F5C543;--ttl:#7A2E12;--sub:#7A2E12}
.t-modern{--bg:#2B2350;--ttl:#FFD84A;--sub:#5FE3F0}
@media (min-width:641px){
  .menu{padding:16px;gap:12px}
  .msign h2{font-size:30px}
  .msign p{font-size:13px}
  .ribbons{flex-wrap:wrap;overflow:visible}
  .book{grid-template-columns:1fr 1fr}
  .book::after{display:block}
  .page{--band:clamp(62px,13vw,124px);--mar:clamp(22px,5.5vw,62px);--foot:clamp(34px,7vw,72px)}
  .page.t-south,.page.t-modern{--band:clamp(70px,16vw,150px)}
  .page.L{grid-column:1;transform-origin:right center;border-radius:14px 0 0 14px}
  .page.R{grid-column:2;transform-origin:left center;border-radius:0 14px 14px 0}
}

/* page turn: the outgoing page and the incoming one are the two faces of the same leaf, swinging on the spine */
.page.turn{z-index:3}
.outR{animation:outR .85s cubic-bezier(.42,.05,.4,1) forwards}
.inL{animation:inL .85s cubic-bezier(.42,.05,.4,1) forwards}
.outL{animation:outL .85s cubic-bezier(.42,.05,.4,1) forwards}
.inR{animation:inR .85s cubic-bezier(.42,.05,.4,1) forwards}
.outR::after,.outL::after{animation:shadeIn .85s cubic-bezier(.42,.05,.4,1) forwards}
.inL::after,.inR::after{animation:shadeOut .85s cubic-bezier(.42,.05,.4,1) forwards}
.covered::after{animation:dim .85s ease-in forwards}
.revealed::after{animation:undim .85s ease-out forwards}
@keyframes outR{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
@keyframes inL{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
@keyframes outL{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
@keyframes inR{from{transform:rotateY(-180deg)}to{transform:rotateY(0)}}
@keyframes shadeIn{from{opacity:0}50%{opacity:.55}to{opacity:.55}}
@keyframes shadeOut{from{opacity:.55}50%{opacity:.55}to{opacity:0}}
@keyframes dim{from{opacity:0}to{opacity:.45}}
@keyframes undim{from{opacity:.45}to{opacity:0}}

/* page furniture */
.art{display:block}
.in{display:block}
.band{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;padding:6px 10px 0;min-width:0}
.tt{align-self:center;min-width:0}
.ttl{font-family:var(--display);font-weight:400;font-size:clamp(15px,9cqw,36px);line-height:1;margin:0;color:var(--ttl);letter-spacing:.5px}
.psub{display:block;font-weight:600;font-size:clamp(10px,4.2cqw,15px);color:var(--sub);margin-top:2px}
.mark{margin-right:auto;align-self:center;font-family:var(--display);font-size:clamp(10px,5.4cqw,22px);line-height:1.1;color:var(--ttl);text-wrap:balance;min-width:0}
.band .small{height:72%;flex:none}
.band .land{height:94%;flex:none}
.band .small,.band .land{margin-bottom:5px}
.band .s2{height:56%}
.band .s2.top{align-self:flex-start;margin-top:-6px}
.R .band{justify-content:flex-end;gap:clamp(8px,6cqw,44px)}
.band .small svg,.band .land svg{height:100%;width:auto}
.margin{grid-row:2;display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:6px 0}
.margin .in{width:86%}
.margin svg{width:100%;height:auto}
.L .margin{grid-column:1}.L .panel{grid-column:2}
.R .margin{grid-column:2}.R .panel{grid-column:1}
.panel{grid-row:2;position:relative;min-width:0;padding:10px 8px 10px 15%;color:var(--paper-ink)}
.R .panel{padding:10px 15% 10px 8px}
.scal{position:absolute;inset:0;width:100%;height:100%}
.R .scal{transform:scaleX(-1)}
.cards{position:relative;height:100%;display:flex;flex-direction:column;justify-content:space-evenly;gap:4px}
.pfoot{grid-column:1/-1;position:relative}
.water{position:absolute;inset:0;width:100%;height:100%;display:block}
.pfoot .obj{position:absolute;bottom:10%;height:90%;z-index:1}
.pfoot .obj svg{height:100%;width:auto}
.L .pfoot .obj{left:16%}.R .pfoot .obj{right:16%}

/* dish cards */
.card{position:relative;display:grid;grid-template-columns:clamp(34px,23cqw,72px) minmax(0,1fr);gap:6px;align-items:center;text-align:left;
  padding:4px 6px;border-radius:10px;border:1.5px solid transparent;background:transparent;color:var(--paper-ink);cursor:pointer;
  font:600 clamp(12px,3.6cqw,16px)/1.25 var(--body);transition:transform .15s,background .15s,box-shadow .15s}
.card:hover{background:#F9BE1A40;transform:translateY(-2px);box-shadow:0 4px 0 #10312A22}
.card:active{transform:scale(.96)}
.card.sel{background:var(--gold);border-color:var(--paper-ink)}
.pic{position:relative;display:block}
.pic svg.bowlpic{display:block;width:100%;height:auto;transition:transform .2s}
.card:hover .bowlpic{transform:translateY(-3px) rotate(-4deg)}
.card.hop .bowlpic{animation:hop .5s}
.st{position:absolute;left:25%;top:-18%;width:50%;opacity:0;transition:opacity .2s}
.card:hover .st,.card.sel .st{opacity:1}
.st path{animation:steam 1.4s ease-in-out infinite}
.st path+path{animation-delay:.5s}
.txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.crule{display:none;font-weight:400;font-size:12px;line-height:1.35;color:var(--paper-soft)}
.card.sel .crule{color:var(--paper-ink)}
@container (min-width:300px){.crule{display:block}}
.stamp{position:absolute;right:2px;top:0;font:400 clamp(11px,4.6cqw,18px) var(--display);color:var(--sign);border:2.5px solid var(--sign);border-radius:6px;
  padding:1px 6px;background:#FFF8E6EE;transform:translateY(-45%) rotate(8deg);pointer-events:none;animation:thump .38s cubic-bezier(.3,1.7,.5,1) both}
.how{display:grid;grid-template-columns:clamp(30px,17cqw,56px) minmax(0,1fr);gap:8px;align-items:center;font-size:clamp(11px,3.4cqw,15px);line-height:1.35;padding:2px 4px}
.how svg{width:100%;height:auto;display:block}
.bit{position:absolute;left:var(--x);top:var(--y);width:11px;height:5px;border-radius:3px;background:var(--c);z-index:8;pointer-events:none;animation:fly .8s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes hop{30%{transform:translateY(-12px) rotate(-10deg)}60%{transform:translateY(0) rotate(5deg)}80%{transform:translateY(-3px)}}
@keyframes thump{from{transform:translateY(-45%) rotate(8deg) scale(2.8);opacity:0}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes steam{0%{transform:translateY(4px);opacity:0}40%{opacity:1}100%{transform:translateY(-5px);opacity:0}}

/* corners that turn the page */
.corner{position:absolute;bottom:0;width:clamp(26px,5.5vw,48px);height:clamp(26px,5.5vw,48px);border:0;padding:0;cursor:pointer;z-index:6;transition:transform .2s;animation:peek 2.6s ease-in-out infinite}
.corner.next{right:0;transform-origin:100% 100%;border-radius:0 0 14px 0;background:linear-gradient(315deg,var(--wall) 45%,#B9AE8E 46%,#FFF8E6 58%,#FFF8E6 62%,#0000 63%)}
.corner.prev{left:0;transform-origin:0 100%;border-radius:0 0 0 14px;background:linear-gradient(45deg,var(--wall) 45%,#B9AE8E 46%,#FFF8E6 58%,#FFF8E6 62%,#0000 63%)}
.corner:hover{transform:scale(1.45);animation:none}
@keyframes peek{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}

/* living illustrations */
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite}
.swing{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite}
.swing:nth-of-type(2n){animation-duration:3.9s;animation-direction:reverse}
.band{position:relative}
.band .edge{position:absolute;top:0;right:0;bottom:0;width:min(56%,calc(var(--band) * 1.8))}
.band .edge svg{width:100%;height:100%}
.band .s3{height:94%}
@container (max-width:300px){.band .s2,.band .s3{display:none}}
.ttl.rg{font-size:clamp(20px,11.5cqw,54px)}
.ttl small{display:block;font-size:.4em;letter-spacing:1.5px;line-height:1.15}
.ttl .big{display:block;padding-top:.34em;line-height:1}
.L .pfoot .obj.trav{left:0;right:0}
.trav .sail{display:block;position:absolute;bottom:0;height:100%;left:30%;animation:travel 26s linear infinite}
@keyframes travel{from{left:-28%}to{left:102%}}
.oar{transform-box:view-box;transform-origin:33px 31px;animation:row 1.6s ease-in-out infinite}
@keyframes row{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
.drift{animation:drift 9s ease-in-out infinite}
.glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
.branch{transform-box:fill-box;transform-origin:100% 0;animation:sway 5s ease-in-out infinite}
.birds{animation:birds 6s ease-in-out infinite}
@keyframes birds{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-4px)}}
.flap{transform-box:fill-box;transform-origin:0 50%;animation:flap 1.8s ease-in-out infinite}
.bob{transform-box:fill-box;transform-origin:50% 50%;animation:bob 2.8s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 14s linear infinite}
.tick{transform-origin:70px 39px;animation:spin 8s linear infinite}
.bloom{transform-box:fill-box;transform-origin:50% 100%;animation:bloom 4s ease-in-out infinite}
.flick{animation:flick 2.3s steps(1) infinite}
.flick2{animation:flick 3.1s steps(1) infinite .7s}
.puff{animation:steam 1.8s ease-in-out infinite}
.wv{animation:wave linear infinite}
.w1{animation-duration:7s}.w2{animation-duration:5s;animation-direction:reverse}.w3{animation-duration:3.6s}
.dash{animation:dash 1s linear infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes flap{0%,100%{transform:skewY(0)}50%{transform:skewY(-7deg) scaleX(.94)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2.5px) rotate(2deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bloom{0%,100%{transform:scale(1)}50%{transform:scale(1.07,1.03)}}
@keyframes flick{0%,100%{opacity:1}45%{opacity:1}50%{opacity:.25}55%{opacity:1}80%{opacity:.5}85%{opacity:1}}
@keyframes wave{to{transform:translateX(-50px)}}
@keyframes dash{to{transform:translateX(-40px)}}
.page.enter .in{animation:rise .6s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:calc(var(--i)*80ms)}
@keyframes rise{from{opacity:.4;transform:translateY(18px) scale(.6)}}

/* under the book */
.turns{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600}
.chip[disabled]{opacity:.35;cursor:default}
/* the chosen dish: a big steaming bowl beside its name, rule and button */
.detail{display:grid;grid-template-columns:clamp(110px,36vw,150px) minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:12px 14px}
.detail.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:translateY(6px) scale(.97);opacity:.5}}
.dpic{position:relative;display:flex;flex-direction:column;align-items:center}
.dpic .hot{display:block;width:72%;height:auto;margin-bottom:-4%;overflow:visible}
.dpic .hot path{fill:none;stroke:var(--soft);stroke-width:5;stroke-linecap:round;opacity:.5;transform-box:fill-box;transform-origin:50% 100%;animation:hot 2.4s ease-in-out infinite}
.dpic .hot path:nth-child(2){animation-delay:.8s}
.dpic .hot path:nth-child(3){animation-delay:1.6s}
@keyframes hot{0%{opacity:.2;transform:translateY(10px) scaleY(.75)}35%{opacity:.95}100%{opacity:.15;transform:translateY(-12px) scaleY(1.15)}}
.dpic .dbowl{display:block;width:100%;height:auto}
.dtxt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.dreg{margin:0;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sign)}
.dname{margin:0;font:600 clamp(20px,6vw,28px)/1.15 var(--body);color:var(--ink);text-wrap:balance}
.drule{margin:2px 0 8px;font-size:14px;line-height:1.4;color:var(--ink);text-wrap:pretty}
.go{font:400 16px var(--display);padding:11px 16px;border-radius:10px;border:1.5px solid #10312A;background:var(--gold);color:#10312A;cursor:pointer}
.go[disabled]{opacity:.4;cursor:default}
@media (min-width:641px){
  .detail{grid-template-columns:minmax(140px,190px) minmax(0,1fr);gap:18px;padding:14px 18px}
  .dreg{font-size:12px}
  .drule{font-size:15px;max-width:52ch}
}
.cbest{font-weight:400;font-size:.8em;color:var(--paper-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.card[aria-pressed="true"]{border-color:var(--paper-ink);border-style:dashed}
.mOut{animation:outR .7s cubic-bezier(.42,.05,.4,1) forwards}
.mIn{animation:inR .7s cubic-bezier(.42,.05,.4,1) forwards}
.mOut::after{animation:shadeIn .7s cubic-bezier(.42,.05,.4,1) forwards}
.mIn::after{animation:shadeOut .7s cubic-bezier(.42,.05,.4,1) forwards}
@media (prefers-reduced-motion:reduce){.menuwrap *,.menuwrap *::before,.menuwrap *::after{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="top">
  <div class="topbar">
    <header class="sign">
      <h1>Húp Phở</h1>
      <p data-en="30 bowls, one rule each. First to empty the bowl wins.">30 tô, mỗi tô một luật. Ai sạch tô trước thì thắng.</p>
    </header>
    <div class="lang" role="group" aria-label="Ngôn ngữ / Language"><button type="button" data-lang="vi">VI</button><button type="button" data-lang="en">EN</button></div>
  </div>

  <nav class="nav" aria-label="Chọn tô" data-en-label="Choose a bowl">
    <button class="chip daily" id="dailybtn" type="button" data-en="Daily bowl">Tô hôm nay</button>
    <button class="chip" id="prev" type="button" aria-label="Tô trước" data-en-label="Previous bowl">‹</button>
    <button class="chip" id="next" type="button" aria-label="Tô sau" data-en-label="Next bowl">›</button>
    <button class="chip" id="tomenu" type="button" aria-haspopup="dialog" data-en="Menu: 30 bowls">Thực đơn 30 tô</button>
    <button class="chip duelbtn" id="duelbtn" type="button" data-en="Find opponent">Tìm đối thủ</button>
    <button class="chip" id="sndbtn" type="button">Tiếng: bật</button>
  </nav>

  <div class="info">
    <div>
      <div class="dish" id="dish">Phở bò</div>
      <div class="rule" id="rule"></div>
      <div class="sub" id="hud"></div>
    </div>
    <div style="text-align:right">
      <div class="clock" id="clock">0,00</div>
      <div class="sub" id="best">Chưa có kỷ lục</div>
    </div>
  </div>

  <section class="duel" id="duel" hidden aria-live="polite">
    <div class="duelhead">
      <span class="me"><span data-en="You">Bạn</span>: <b id="dmyname"></b> <button class="linkbtn" id="dreroll" type="button" data-en="new name">đổi tên</button></span>
      <button class="chip" id="dleave" type="button" data-en="Leave">Rời trận</button>
    </div>
    <div class="opp" id="opp" hidden>
      <span class="opic" id="opic"></span>
      <span class="oname"><span id="oname"></span><span class="otag" id="otag"></span></span>
      <span class="otime" id="otime"></span>
      <div class="olevel" aria-hidden="true"><i id="obar"></i></div>
      <span class="ostat" id="ostat"></span>
    </div>
    <div class="dmsg" id="dmsg"></div>
  </section>

  <div class="table">
    <div class="count" id="count" hidden aria-live="assertive"></div>
    <svg viewBox="0 0 320 240" role="img" aria-label="Tô mì. Chạm vào tô để gắp xương." data-en-label="Bowl of noodles. Tap the bowl to pick out bones." id="svg">
      <defs><clipPath id="lvclip"><rect id="lvrect" x="0" y="98" width="320" height="150"/></clipPath></defs>
      <g id="bowl">
        <g id="steam" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" opacity=".9">
          <path d="M120 58 q-10 -13 0 -26 q10 -13 0 -26"/><path d="M160 54 q-10 -13 0 -26 q10 -13 0 -26"/><path d="M200 58 q-10 -13 0 -26 q10 -13 0 -26"/>
        </g>
        <g id="mom" opacity="0">
          <ellipse cx="128" cy="26" rx="20" ry="13" fill="#fff" stroke="#10312A" stroke-width="3"/><ellipse cx="192" cy="26" rx="20" ry="13" fill="#fff" stroke="#10312A" stroke-width="3"/>
          <circle cx="130" cy="30" r="6" fill="#10312A"/><circle cx="190" cy="30" r="6" fill="#10312A"/>
          <path d="M106 8 l40 8 M214 8 l-40 8" stroke="#10312A" stroke-width="4" stroke-linecap="round"/>
        </g>
        <g id="vessel"></g>
        <g id="strand" fill="none" stroke-linecap="round" opacity="0"></g>
        <g id="longn" fill="none" stroke-linecap="round" opacity="0" stroke-dasharray="100">
          <path id="ln1" pathLength="100" d="M160 106 q-14 -17 0 -34 q14 -17 0 -34 q-14 -17 0 -34" stroke="#10312A"/>
          <path id="ln2" pathLength="100" d="M160 106 q-14 -17 0 -34 q14 -17 0 -34 q-14 -17 0 -34"/>
        </g>
      </g>
    </svg>
    <div class="gauge" aria-hidden="true"><span data-en="Bowl">Tô</span><div class="level"><i id="bar"></i></div></div>
    <div class="gauge" aria-hidden="true"><span data-en="Air">Hơi</span><div class="level"><i id="breath"></i></div></div>
  </div>

  <div class="msg" id="msg" role="status"></div>

  <div class="controls">
    <button class="btn main" id="slurp" type="button">Bắt đầu húp</button>
    <button class="btn" id="micbtn" type="button" hidden data-en="Mic off">Tắt mic</button>
    <button class="btn" id="again" type="button" data-en="New bowl">Múc tô mới</button>
  </div>

  <div class="mic" id="microw" hidden>
    <span>Mic</span>
    <div class="meter"><i id="mlevel"></i><b></b></div>
    <span id="mstate">đang nghe</span>
  </div>

  <!-- the result slides up over the bottom of the screen: a stamped verdict, the race score, then what to do next -->
  <section class="result" id="result" hidden role="dialog" aria-labelledby="rbig" aria-live="polite">
    <div class="rstamp" id="rstamp"><span id="rbig">SẠCH TÔ!</span></div>
    <p class="rwarn" id="rwarn" hidden><span class="wicon" aria-hidden="true">!</span><span id="rwarntext"></span></p>
    <div class="vs" id="vs" hidden>
      <div class="side" id="vsme"><span class="vsn" id="vsmen"></span><b class="vst" id="vsmet"></b></div>
      <span class="vsx">VS</span>
      <div class="side" id="vsop"><span class="vsn" id="vsopn"></span><b class="vst" id="vsopt"></b></div>
    </div>
    <h2 id="rtitle">Thánh Húp</h2>
    <p id="rtext"></p>
    <div class="controls">
      <button class="btn main" id="rnext" type="button" data-en="Next bowl ›">Tô tiếp theo ›</button>
      <button class="btn main" id="drematch" type="button" hidden>Đấu lại</button>
      <button class="btn" id="dnew" type="button" hidden data-en="New opponent">Tìm đối thủ mới</button>
      <button class="btn" id="rclose" type="button" data-en="Close">Đóng</button>
    </div>
  </section>

  <!-- warnings that must not be missed, such as an opponent leaving -->
  <div class="toast" id="toast" hidden role="alert"><span class="wicon" aria-hidden="true">!</span><span><b id="toastt"></b><span id="toasts"></span></span></div>

  <p class="foot"><span data-en="Records are saved on this device only.">Kỷ lục chỉ lưu trên máy này.</span> <button class="linkbtn" id="howto" type="button" data-en="How to play">Cách chơi</button></p>
</main>

<div class="menuwrap" id="menuwrap" hidden>
  <div class="menu" role="dialog" aria-modal="true" aria-label="Thực đơn Húp Phở" data-en-label="Húp Phở menu">
    <div class="menubar">
      <header class="sign msign">
        <h2>Húp Phở</h2>
        <p data-en="A menu of 30 bowls. Turn the pages from North to South.">Thực đơn 30 tô. Lật trang để đi từ Bắc vào Nam.</p>
      </header>
      <div class="mtools"><div class="lang" role="group" aria-label="Ngôn ngữ / Language"><button type="button" data-lang="vi">VI</button><button type="button" data-lang="en">EN</button></div><button class="chip" id="bookclose" type="button" data-en="Close ✕">Đóng ✕</button></div>
    </div>
    <nav class="ribbons" id="ribbons" aria-label="Các trang thực đơn" data-en-label="Menu pages"></nav>
    <div class="stage">
      <div class="book" id="book">
        <button class="corner prev" id="cprev" type="button" aria-label="Lật về trang trước" data-en-label="Turn back a page"></button>
        <button class="corner next" id="cnext" type="button" aria-label="Lật sang trang sau" data-en-label="Turn the page"></button>
      </div>
    </div>
    <div class="turns">
      <button class="chip" id="bprev" type="button" data-en="‹ Previous page">‹ Trang trước</button>
      <span id="pnum" aria-live="polite"></span>
      <button class="chip" id="bnext" type="button" data-en="Next page ›">Trang sau ›</button>
    </div>
    <section class="detail" id="detail" aria-live="polite">
      <div class="dpic" id="dpic"></div>
      <div class="dtxt">
        <p class="dreg" id="dreg"></p>
        <h3 class="dname" id="dname"></h3>
        <p class="drule" id="drule"></p>
        <button class="go" id="go" type="button" data-en="Slurp this bowl">Húp tô này</button>
      </div>
    </section>
  </div>
</div>

  /* sound: looped filtered noise while slurping plus short beeps. The hissing loop would trigger the mic's slurp detector,

  function spawn(){

  function tick(now){

      if(ev){

          else if(age>1.3){clearEv();flash(tx(W(d.treatName)+' chìm mất rồi.','The '+W(d.treatName).toLowerCase()+' sank.'));}
        }else if(ev.type==='lime'){
          if(slurping&&age>.25){level=Math.max(0,level-.03);clearEv();flash(tx('Vắt chanh xong, ngon.','Lime squeezed. Tasty.'));}
          else if(age>1.4){level=Math.min(cap,level+.1);clearEv();flash(tx('Chua quá! Tô đầy lại.','Too sour! The bowl refills.'),true);}
        }else if(ev.type==='bone'){

        }else if(ev.type==='mom'){
          if(age>2)clearEv();

        }

        }else if(longN.on){longN=null;level=Math.min(cap,level+.12);schedule(2.5);flash(tx('Đứt sợi! Rơi lại vào tô.','Noodle broke! It fell back in.'),true);}
      }

        if(d.hot&&elapsed<d.hot&&holdT>.8){block('choke',1.5,tx('Bỏng lưỡi! Còn nóng mà húp dài.','Burnt tongue! Too hot for long slurps.'));slurping=false;}

          else if(breath<=0&&level>0){block('gasp',2,tx('Hết hơi! Thở hai giây đã.','Out of air! Breathe for two seconds.'));slurping=false;}

      if(level<=0){finish();slurping=false;}

      else if(ev&&ev.type==='bone')say(tx('Có '+W(d.boneName)+'! Chạm vào tô để gắp ra.','A '+W(d.boneName)+'! Tap the bowl to pick it out.'),true);
      else if(ev&&ev.type==='mom')say(tx('Mẹ đang nhìn! Ngừng húp.','Mom is watching! Stop slurping.'),true);
      else if(ev&&ev.type==='lime')say(tx('Chanh! Húp ngay kẻo chua.','Lime! Slurp it before it turns sour.'));
      else if(ev&&ev.type==='treat')say(tx(W(d.treatName)+' kìa! Húp ngay.',W(d.treatName)+'! Slurp it now.'));
      else if(longN)say(longN.on?tx('Giữ hơi! Đừng ngắt.','Keep going! Don’t stop.'):(longN.wait?tx('Sợi dài! Nhả ra, lấy hơi đã.','Long noodle! Stop and take a breath first.'):tx('Sợi dài! Húp một hơi không ngắt.','Long noodle! Slurp it in one go.')));
      else if(lock)say(tx('Nhả ra rồi gắp miếng mới.','Let go, then take the next bite.'));
      else if(elapsed<flashUntil)say(flashText,flashHot);
      else if(d.hot&&elapsed<d.hot)say(tx('Còn nóng! Húp từng hơi ngắn thôi.','Still hot! Short slurps only.'),true);
      else if(d.needTreats&&treats<d.needTreats&&level<=.07)say(tx('Chờ '+W(d.treatName).toLowerCase()+' nổi lên rồi húp.','Wait for a '+W(d.treatName).toLowerCase()+' to float up, then slurp it.'));
      else say(slurping?tx('Sụt sụt sụt…','Sluuurp…'):tx('Thở xong chưa? Húp tiếp.','Caught your breath? Keep slurping.'));
      hud();
    }
    var v=VES[d.ves||'bowl'], ys=v.top+(1-level)*v.depth, sc=Math.max(.05,Math.min(v.maxRx,v.hw(ys)-4)/116), dy=ys-98;
    strand.setAttribute('opacity',slurping&&!longN?'1':'0');
    strand.setAttribute('transform','translate('+(Math.sin(now/40)*3).toFixed(1)+','+(dy-((now/6)%20)).toFixed(1)+')');
    var ln=$('longn');ln.setAttribute('opacity',longN?'1':'0');
    if(longN){
      ln.setAttribute('stroke-dashoffset',(-(longN.got/d.longLen)*100).toFixed(1));
      ln.setAttribute('transform','translate('+(Math.sin(now/(longN.on?40:160))*3).toFixed(1)+','+((v.top-98)+(ys-v.top)*.5).toFixed(1)+')');
    }
    var el=$('ev'),show=ev&&ev.type!=='mom',warn=ev&&(ev.type==='chili'||ev.type==='bone'||ev.type==='fake')&&(elapsed-ev.t0)<d.grace&&Math.floor(now/90)%2;
    if(el)el.setAttribute('opacity',show?(warn?'.35':'1'):'0');
    $('mom').setAttribute('opacity',ev&&ev.type==='mom'?'1':'0');
    fill.setAttribute('transform','translate(160,'+ys.toFixed(1)+') scale('+sc.toFixed(3)+') translate(-160,-98)');
    fill.setAttribute('opacity',Math.min(1,level/.05).toFixed(2));
    /* milestones: surface toppings get eaten one by one as the bowl drains */
    var nTop=topEls.length,left=Math.min(nTop,Math.ceil(level/Math.max(d.start,.01)*nTop-1e-6));
    if(left!==topLeft){
      for(var ti=0;ti<nTop;ti++)topEls[ti].setAttribute('opacity',ti<left?'1':'0');
      if(left<topLeft&&left>0&&started&&!done)beep(520+(nTop-left)*70,.09,'sine',.14);
      topLeft=left;
    }
    slurpSound(slurping,now);
    $('lvrect').setAttribute('y',ys.toFixed(1));
    bar.style.width=Math.round(level/Math.max(d.start,.01)*100)+'%';
    var br=$('breath');br.style.width=Math.round(breath*100)+'%';br.classList.toggle('low',breath<.25);
    steam.setAttribute('opacity',(.15+level*.75).toFixed(2));
    clock.textContent=fmt(elapsed);
    if(micOn)readMic();
    Duel.frame();
    requestAnimationFrame(tick);
  }

  /* "Bắt đầu húp": ask for the mic if it is off, measure the room for a second, then the run starts. Only real slurps drain the bowl. */
  slurpBtn.addEventListener('click',function(){
    audio();
    if(Duel.blocks())return;
    if(started&&!done)return;
    if(done)reset();
    if(micOn&&!calibrating){begin();return;}
    pendingStart=true;paintStart();
    if(!micOn)micStart();
  });
  $('sndbtn').addEventListener('click',function(){muted=!muted;store.mute=muted;save();paintSound();audio();});
  paintSound();
  function grab(){if(ev&&ev.type==='bone'&&!done){clearEv();flash(tx('Gắp '+W(d.boneName)+' ra rồi. Húp tiếp.','Picked out the '+W(d.boneName)+'. Keep slurping.'));}}
  svg.addEventListener('pointerdown',grab);
  window.addEventListener('keydown',function(e){if(!bookOpen&&(e.key==='x'||e.key==='X'))grab();});
  $('again').addEventListener('click',reset);
  $('dailybtn').addEventListener('click',function(){pick(dailyIdx,true);});
  $('prev').addEventListener('click',function(){pick((cur+DISHES.length-1)%DISHES.length,false);});
  $('next').addEventListener('click',function(){pick((cur+1)%DISHES.length,false);});
  $('rnext').addEventListener('click',function(){pick((cur+1)%DISHES.length,false);});
  $('tomenu').addEventListener('click',function(){Menu.open(1+['B','T','N','V'].indexOf(d.r));});
  $('howto').addEventListener('click',function(){Menu.open(0);});
  $('rclose').addEventListener('click',function(){result.hidden=true;});

  var actx=null,analyser=null,stream=null,buf=null,lo0=0,lo1=0,hi0=0,hi1=0,floorDb=-90,calN=0,calSum=0,calUntil=0,onFrames=0,offAt=0;
  /* turning the mic off mid-bowl pauses the run; "Bắt đầu húp" picks it up again */
  function micOff(text){
    micOn=false;micSlurp=false;calibrating=false;pendingStart=false;
    if(started&&!done)started=false;
    try{if(stream)stream.getTracks().forEach(function(t){t.stop();});}catch(e){}
    try{if(actx)actx.close();}catch(e){}
    stream=null;actx=null;analyser=null;
    $('microw').hidden=true;micBtn.hidden=true;paintStart();
    say(text||(elapsed>0&&!done?pausedText():idleText()),!!text);
  }
  function micStart(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){micOff(tx('Trình duyệt này không cho dùng mic, nên chưa húp được. Hãy mở trang bằng Chrome hoặc Safari mới.','This browser can’t use the mic, so you can’t play yet. Open the page in a recent Chrome or Safari.'));return;}
    say(tx('Cho phép dùng mic để bắt đầu húp.','Allow the mic to start slurping.'));
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(s){
      stream=s;
      var AC=window.AudioContext||window.webkitAudioContext;actx=new AC();
      var src=actx.createMediaStreamSource(s);analyser=actx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.3;src.connect(analyser);if(actx.state==='suspended')actx.resume();
      buf=new Float32Array(analyser.frequencyBinCount);
      var hz=actx.sampleRate/analyser.fftSize;lo0=Math.ceil(250/hz);lo1=Math.floor(1000/hz);hi0=Math.ceil(2000/hz);hi1=Math.min(buf.length-1,Math.floor(8000/hz));
      calN=0;calSum=0;onFrames=0;calUntil=performance.now()+1000;micOn=true;calibrating=true;
      $('microw').hidden=false;micBtn.hidden=false;$('mstate').textContent=tx('đo tiếng ồn…','measuring noise…');
      paintStart();say(tx('Im lặng một giây để đo tiếng ồn xung quanh.','Stay quiet for a second while we measure the room.'));
    }).catch(function(){
      micOff(tx('Chưa có mic thì chưa húp được. Cho phép mic trong trình duyệt rồi bấm "Bắt đầu húp" lại. Nếu trang không hỏi mic, hãy mở nó trên web riêng.','You need the mic to play. Allow it in your browser, then press "Start slurping" again. If the page never asks, open it on its own site.'));
    });
  }
  micBtn.addEventListener('click',function(){micOff();});
  /* A slurp is hiss: loud above 2 kHz, noisy rather than tonal, weak in the voice band, and it lasts.
     Speech and music are strong below 1 kHz, whistles are tonal, claps and taps are too short. */
  /*SLURP-DETECT*/
  function micFeatures(db,l0,l1,h0,h1){
    var i,p,lo=0,hi=0,lg=0,n=h1-h0+1;
    for(i=l0;i<=l1;i++)lo+=Math.pow(10,Math.max(-140,db[i])/10);
    for(i=h0;i<=h1;i++){p=Math.pow(10,Math.max(-140,db[i])/10);hi+=p;lg+=Math.log(p);}
    lo/=(l1-l0+1);hi/=n;
    return {hi:10*Math.log10(hi),lo:10*Math.log10(lo),flat:Math.exp(lg/n)/hi};
  }
  function micJudge(f,now){
    var loud=f.hi>floorDb+10,hissy=f.hi>f.lo-10&&f.flat>.2;
    if(loud&&hissy){onFrames++;offAt=now+160;}else if(now>offAt)onFrames=0;
    if(!loud)floorDb+=(f.hi-floorDb)*.01;
    return {loud:loud,hissy:hissy,slurp:onFrames>=8};
  }
  /*END-SLURP-DETECT*/
  function readMic(){
    if(!analyser)return;
    analyser.getFloatFrequencyData(buf);
    var f=micFeatures(buf,lo0,lo1,hi0,hi1),now=performance.now();
    if(now<calUntil){calSum+=f.hi;calN++;micSlurp=false;return;}
    if(calibrating){
      if(calN)floorDb=calSum/calN;calN=0;calibrating=false;
      if(pendingStart)begin();else paintStart();
    }
    var j=micJudge(f,now);micSlurp=j.slurp;
    $('mlevel').style.width=Math.max(0,Math.min(100,(f.hi-floorDb)/20*100)).toFixed(0)+'%';
    $('mstate').textContent=micSlurp?tx('nghe thấy húp','slurp heard'):(j.loud&&!j.hissy?tx('có tiếng, nhưng không phải tiếng húp','sound, but not a slurp'):tx('đang nghe','listening'));
  }

  function paintStatic(){
    [].forEach.call(document.querySelectorAll('[data-en]'),function(el){if(el.dataset.vi===undefined)el.dataset.vi=el.textContent;el.textContent=lang==='en'?el.dataset.en:el.dataset.vi;});
    [].forEach.call(document.querySelectorAll('[data-en-label]'),function(el){if(el.dataset.viLabel===undefined)el.dataset.viLabel=el.getAttribute('aria-label');el.setAttribute('aria-label',lang==='en'?el.dataset.enLabel:el.dataset.viLabel);});
    [].forEach.call(document.querySelectorAll('.lang button'),function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-lang')===lang));});
    document.documentElement.lang=lang;
  }
  /* switching language redraws every visible word in place; a bowl in progress keeps going */
  function applyLang(l){
    lang=l==='en'?'en':'vi';store.lang=lang;save();
    paintStatic();paintSound();paintStart();paintDish();showBest();hud();
    var ct=document.querySelector('#vessel text');if(ct)ct.textContent=tx('SẠCH!','CLEAN!');
    if(!result.hidden)paintResult();
    if(done)say(tx('Sạch tô!','Bowl cleaned!'));else if(!started)say(elapsed>0?pausedText():idleText());
    if(micOn&&calibrating)$('mstate').textContent=tx('đo tiếng ồn…','measuring noise…');
    Menu.relang();DISHES.forEach(function(q){paintBest(q);});markItems();
    Duel.paint();
  }
  [].forEach.call(document.querySelectorAll('.lang button'),function(b){b.addEventListener('click',function(){applyLang(b.getAttribute('data-lang'));});});
  function start(data){
    paintStatic();
    buildBoard();
    if(typeof data.cur==='number'&&data.cur>=0&&data.cur<DISHES.length)pick(data.cur,!!data.daily);else pick(dailyIdx,true);
    requestAnimationFrame(tick);
  }
  var hot=window.claude&&window.claude.hot;
  if(hot&&hot.snapshot)hot.snapshot(function(){return {cur:cur,daily:isDaily};});
  if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
