<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Húp Phở</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one phone-width column; a hand-painted street sign on a mint stall wall, bowl on a steel table; the 31-dish menu is a flip-through menu book in an overlay */
  --wall:#E1F0E6; --card:#F6FBF7; --ink:#10312A; --soft:#4B6B62;
  --sign:#D7262B; --gold:#F9BE1A; --steel:#C5D2CC; --line:#10312A22;
  --paper:#FFF8E6; --paper-ink:#10312A; --paper-soft:#4B6B62;
  --display:"Bungee","Arial Black",sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --wall:#0D201C; --card:#142B26; --ink:#E4F1EA; --soft:#9DB8AF;
    --sign:#E9383D; --gold:#F9BE1A; --steel:#1D3832; --line:#E4F1EA26;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --wall:#0D201C; --card:#142B26; --ink:#E4F1EA; --soft:#9DB8AF;
  --sign:#E9383D; --gold:#F9BE1A; --steel:#1D3832; --line:#E4F1EA26;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
main{max-width:440px;margin:0 auto;padding:18px 16px 16px;display:flex;flex-direction:column;align-items:stretch;gap:12px}
.sign{background:var(--sign);padding:12px 16px 10px;border-radius:6px;transform:rotate(-1.2deg);align-self:flex-start;border:3px solid var(--gold)}
.sign h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,11vw,42px);line-height:1;margin:0;color:var(--gold);letter-spacing:1px}
.sign p{margin:4px 0 0;font-size:13px;font-weight:600;color:#fff}
/* the tool row: the daily bowl on the left, menu, sound and language on the right */
.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.tright{display:flex;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:999px;font:600 12px var(--body);cursor:pointer;border:1.5px solid var(--gold);background:transparent;color:var(--ink)}
.pill.daily[aria-pressed="true"]{background:var(--gold);color:#412402}
.pill.ghost{border-color:var(--soft)}
.pill svg,.round svg,.arrow svg,.quiet svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.round{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--soft);background:transparent;color:var(--ink);display:inline-grid;place-items:center;padding:0;font:600 11px var(--body);cursor:pointer}
/* the dish: its name between two arrows, then its rule in a chip */
.dishhead{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.dishrow{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.dish{margin:0;font:400 clamp(18px,6vw,22px)/1.15 var(--display);color:var(--ink);text-wrap:balance;min-width:0}
.arrow{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--soft);display:grid;place-items:center;padding:0;cursor:pointer}
.arrow svg{width:22px;height:22px}
.arrow:hover{color:var(--ink)}
.dishhead .sub span+span:not(:empty)::before{content:" · "}
.pill:focus-visible,.round:focus-visible,.arrow:focus-visible,.quiet:focus-visible,.hup:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.pill:disabled,.round:disabled,.arrow:disabled,.quiet:disabled{opacity:.35;cursor:default}
/* the round button and its two rings */
.hupwrap{position:relative;width:140px;height:140px;align-self:center;display:grid;place-items:center}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none}
.rtrack{stroke:var(--steel);stroke-width:7}
.rtrack.thin{stroke-width:3}
.rbowl{stroke:var(--ink);stroke-width:7;stroke-linecap:round;stroke-dasharray:100 100;transition:stroke-dashoffset .15s linear}
.rair{stroke:var(--soft);stroke-width:3;stroke-linecap:round;stroke-dasharray:100 100}
.rair.low{stroke:var(--sign)}
.hup{position:relative;width:100px;height:100px;border-radius:50%;border:0;background:var(--gold);color:#10312A;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0 8px;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;box-shadow:0 4px 0 #0003;transition:transform .12s,background .15s}
.hup:active{transform:scale(.96)}
.hup.on{background:var(--sign);color:#fff;animation:throb .5s ease-in-out infinite alternate}
@keyframes throb{to{transform:scale(1.04)}}
.hword{font:400 28px/1 var(--display);letter-spacing:1px}
html[lang="en"] .hword{font-size:19px;letter-spacing:.5px}
.hup .clock{display:none;font:400 26px/1 var(--display);font-variant-numeric:tabular-nums}
.hup.run .hword{display:none}
.hup.run .clock{display:block}
.hlabel{font:600 10px/1.2 var(--body);max-width:86px;text-wrap:balance}
/* the sound the bowl wants: PHÙ (blow, orange) or KHỤ (cough, red) replaces the clock while it lasts */
.hup.say .hword{display:block}
.hup.say .clock{display:none}
.hup.m-blow{background:#F0884A;color:#3A1405}
.hup.m-blow.on{background:#F06A1E;color:#fff}
.hup.m-cough{background:var(--sign);color:#fff}
.hup.puff{animation:puff .3s cubic-bezier(.3,1.8,.5,1)}
@keyframes puff{40%{transform:scale(1.16)}}
.rair.heat{stroke:#F0884A}
.rair.spice{stroke:var(--sign)}
/* a hot bowl glows and steams hard until it is blown cool */
.table.hot svg{filter:drop-shadow(0 0 16px #FF6A2A99)}
.table.hot #steam path{animation:hot 1s ease-in-out infinite;stroke-width:6}
.table.hot #steam path:nth-child(2){animation-delay:.33s}
.table.hot #steam path:nth-child(3){animation-delay:.66s}
.debug{position:fixed;left:8px;bottom:8px;z-index:30;margin:0;padding:8px 10px;border-radius:8px;background:#000C;color:#9FF;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;pointer-events:none;white-space:pre}
@media (prefers-reduced-motion:reduce){.hup.on,.hup.puff,.table.hot #steam path{animation:none}}
.links{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 16px}
.quiet{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--soft);font:600 13px var(--body);padding:6px 4px;cursor:pointer}
.quiet:hover{color:var(--ink)}
.quiet.duelbtn{color:var(--sign)}
.duelrow{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 16px;margin-top:-12px}
.duelrow .quiet{padding-top:2px}
.duelrow[hidden]{display:none}
.gauges{display:none}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lang{display:flex;flex:none;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;margin-top:4px}
.lang button{font:600 12px var(--body);padding:6px 10px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--wall)}
.lang button:focus-visible{outline:3px solid var(--sign);outline-offset:-3px}
.mtools{display:flex;align-items:center;gap:8px;flex:none}
.mtools .lang{margin-top:0}
.chip{font:600 13px var(--body);padding:7px 11px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.chip.daily{border-color:var(--sign);color:var(--sign)}
.chip.daily[aria-pressed="true"]{background:var(--sign);color:#fff}
.sub{margin:0;font-size:12px;color:var(--soft)}
.table{position:relative;padding:0 8px}
/* 1v1: the opponent's row above the bowl, and the shared 3-2-1 over it */
.duelbtn{border-color:var(--sign);color:var(--sign)}
.chip:disabled,.btn:disabled{opacity:.35;cursor:default}
.duel{background:var(--card);border:1.5px solid var(--ink);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.duelhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.duelhead .me{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duelhead b{font-weight:600}
.opp{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:3px 10px;align-items:center}
.opic{grid-row:1/4}
.opic svg{display:block;width:46px;height:auto}
.oname{font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.otag{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sign);margin-left:6px}
.otime{font-family:var(--display);font-size:18px;line-height:1;font-variant-numeric:tabular-nums}
.olevel{grid-column:2/4;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.olevel i{display:block;height:100%;width:100%;background:var(--sign);transition:width .12s linear}
.ostat{grid-column:2/4;font-size:13px;color:var(--soft);min-height:18px}
.dmsg{font-size:14px;font-weight:600;text-wrap:pretty}
.dmsg:empty{display:none}
.dinvite{display:flex;gap:8px;align-items:center}
.dinvite input{flex:1;min-width:0;padding:8px 10px;border:1.5px dashed var(--sign);border-radius:8px;background:transparent;color:var(--ink);font:600 13px var(--body)}
.dsend{background:var(--sign);border-color:var(--sign);color:#FFFFFF}
.count{position:absolute;inset:0;z-index:2;display:grid;place-items:center;pointer-events:none;font:400 88px/1 var(--display);color:var(--sign);text-shadow:0 3px 0 #FFFFFF,0 6px 14px #0004}
.count span{animation:countpop .95s ease-out both}
@keyframes countpop{from{transform:scale(1.8);opacity:0}30%{transform:scale(1);opacity:1}to{transform:scale(.92);opacity:.25}}
.dres{font-family:var(--display);font-size:18px;line-height:1.2;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.count span{animation:none}}
.table svg{display:block;width:100%;height:auto;max-width:310px;margin:0 auto;touch-action:manipulation}
.shake{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translateX(-4px)}50%{transform:translateX(4px)}100%{transform:translateX(-4px)}}
/* once the run starts the steam over the bowl rises and drifts; the bowl's own level still sets how much steam there is */
#steam path{transform-box:fill-box;transform-origin:50% 100%}
#bowl.eating #steam path{animation:hot 2.2s ease-in-out infinite}
#bowl.eating #steam path:nth-child(2){animation-delay:.7s}
#bowl.eating #steam path:nth-child(3){animation-delay:1.4s}
@media (prefers-reduced-motion:reduce){.shake,#bowl.eating #steam path{animation:none}}
.msg{min-height:42px;font-weight:600;font-size:15px;text-align:center;text-wrap:balance}
.msg.hot{color:var(--sign)}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 15px var(--body);padding:13px 16px;border-radius:10px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none}
.btn.main{flex:1 1 180px;background:var(--gold);color:#10312A;border-color:#10312A;font-family:var(--display);font-weight:400;font-size:18px;touch-action:none}
.btn.main.on{background:var(--sign);color:#fff}
.btn:focus-visible,.chip:focus-visible,.item:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.mic{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft)}
.meter{flex:1;height:6px;background:var(--line);border-radius:3px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;width:0;background:var(--ink)}
.meter b{position:absolute;top:0;bottom:0;width:2px;background:var(--sign);left:50%}
/* result: a card that slides up from the bottom, mobile first; centred and a little wider from 641px */
.result{position:fixed;left:10px;right:10px;bottom:10px;z-index:15;max-width:460px;margin:0 auto;max-height:calc(100% - 20px);overflow-y:auto;
  background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:18px 16px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  box-shadow:0 -6px 0 var(--gold) inset,0 16px 40px #0007;animation:sheet .45s cubic-bezier(.2,1.2,.4,1) both}
@keyframes sheet{from{transform:translateY(120%)}}
.result h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0;color:var(--ink)}
.result p{margin:0}
.result .controls{width:100%;justify-content:center}
.result .btn.main{flex:1 1 160px;font-size:16px}
.rstamp{font:400 clamp(34px,11vw,52px)/1 var(--display);letter-spacing:1px;padding:8px 18px 6px;border:4px solid currentColor;border-radius:10px;color:var(--sign);
  transform:rotate(-6deg);background:#FFFFFF;margin:4px 0 6px}
.rstamp.thump{animation:stamp .5s cubic-bezier(.3,1.7,.5,1) both}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.6);opacity:0}}
.rstamp.win{color:#B8860B;background:#FFF6D6}
.rstamp.lose{color:#4B6B62;background:#EEF3F0}
.rstamp.wait{color:var(--soft);font-size:clamp(26px,8vw,36px)}
.vs{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.vsx{font:400 14px var(--display);color:var(--soft)}
.side{display:flex;flex-direction:column;gap:2px;padding:8px 6px;border-radius:12px;border:1.5px solid var(--line);min-width:0}
.side.best{border-color:var(--gold);background:#F9BE1A33}
.side.gone{opacity:.55}
.side.gone .vsn{text-decoration:line-through}
.vsn{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vst{font:400 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.rwarn{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--sign);text-align:left}
.wicon{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sign);color:#FFFFFF;font:400 14px/1 var(--display)}
.result .bit{position:absolute;left:var(--x);top:var(--y);width:11px;height:5px;border-radius:3px;background:var(--c);pointer-events:none;animation:fly .9s cubic-bezier(.2,.7,.3,1) forwards}
/* toast: drops in at the top for warnings such as an opponent leaving */
.toast{position:fixed;top:10px;left:10px;right:10px;z-index:25;max-width:460px;margin:0 auto;display:flex;align-items:center;gap:10px;
  background:var(--sign);color:#FFFFFF;border:2px solid #10312A;border-radius:14px;padding:10px 14px;box-shadow:0 10px 24px #0006;animation:toastin .4s cubic-bezier(.2,1.3,.4,1) both,nudge .5s .4s}
.toast .wicon{background:#FFFFFF;color:var(--sign)}
.toast b{display:block;font-size:15px}
.toast span span{font-size:13px}
@keyframes toastin{from{transform:translateY(-140%)}}
@keyframes nudge{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* the opponent's row once they have left */
.opp.gone .oname{text-decoration:line-through;color:var(--soft)}
.opp.gone .olevel i{background:var(--soft)}
.opp.gone .otag{background:var(--sign);color:#FFFFFF;padding:1px 6px;border-radius:999px}
.opp.gone .ostat{color:var(--sign);font-weight:600}
.duel.alert{border-color:var(--sign);box-shadow:0 0 0 3px #D7262B33}
.rphoto{position:relative;align-self:stretch;margin:-18px -16px 2px;aspect-ratio:16/9;border-radius:16px 16px 0 0;overflow:hidden;background:var(--steel);flex:none}
.rphoto img{width:100%;height:100%;object-fit:cover;display:block}
.rphoto .rstamp{position:absolute;left:12px;bottom:12px;margin:0;font-size:clamp(26px,8vw,38px);box-shadow:0 4px 14px #0005}
.rphoto.nophoto{aspect-ratio:auto;margin:0;background:none;overflow:visible;border-radius:0}
.rphoto.nophoto .rstamp{position:static;margin:4px 0 6px;font-size:clamp(34px,11vw,52px);box-shadow:none}
.rinfo{align-self:stretch;display:flex;flex-direction:column;gap:6px;text-align:left;border-top:1.5px dashed var(--line);padding-top:10px;margin-top:2px}
.rinfo .sone,.rinfo .sfa{font-size:13px;line-height:1.45}
.rinfo .sing li{background:var(--wall);color:var(--ink)}
.rinfo .srule{color:var(--soft)}
.rinfo .sfa{animation:none}
.rinfo .sfa b{color:var(--sign)}
@media (min-width:641px){.result{bottom:20px;padding:22px 22px 16px}.rphoto{margin:-22px -22px 2px}}
@media (prefers-reduced-motion:reduce){.result,.rstamp.thump,.toast,.result .bit{animation:none}}
.foot{font-size:12px;color:var(--soft);text-align:center;margin:4px 0 0}
.linkbtn{font:inherit;color:var(--ink);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
/* menu book, mobile first: a phone sees one half page at a time; from 641px wide the book opens to two pages around a spine */
.menuwrap{position:fixed;inset:0;z-index:20;background:var(--wall);overflow-y:auto}
.menu{max-width:1000px;margin:0 auto;padding:12px 12px 20px;display:flex;flex-direction:column;gap:10px}
.menubar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.menubar .chip{flex:none}
.msign{padding:8px 12px 6px}
.msign h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1;margin:0;color:var(--gold);letter-spacing:1px}
.msign p{margin:3px 0 0;font-size:12px}
.menuwrap button:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
/* bookmark ribbons: one row that scrolls sideways on a phone */
.ribbons{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px;align-items:flex-start;margin-bottom:-6px}
.ribbons::-webkit-scrollbar{display:none}
.rib{flex:none;font:600 12px var(--body);border:0;cursor:pointer;padding:7px 10px 15px;background:var(--c);color:var(--t);
  clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 8px),0 100%)}
.rib:hover{transform:translateY(2px)}
.rib[aria-pressed="true"]{padding-bottom:25px}

/* the book */
.stage{padding:14px 0 6px;overflow:hidden}
.book{position:relative;display:grid;grid-template-columns:minmax(0,1fr);perspective:2400px;touch-action:pan-y;filter:drop-shadow(0 10px 14px #0004)}
.book::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:28px;transform:translateX(-50%);z-index:5;pointer-events:none;display:none;
  background:linear-gradient(90deg,#0000,#0002 35%,#0005 50%,#0002 65%,#0000)}
.page{--band:clamp(100px,30vw,150px);--mar:clamp(30px,9vw,48px);--foot:clamp(40px,11vw,64px);
  grid-row:1;grid-column:1;position:relative;display:grid;grid-template-rows:var(--band) 1fr var(--foot);visibility:hidden;overflow:hidden;
  background:var(--bg);container-type:inline-size;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin:left center;border-radius:14px}
.page.L{grid-template-columns:var(--mar) minmax(0,1fr)}
.page.R{grid-template-columns:minmax(0,1fr) var(--mar)}
.page.show{visibility:visible}
.page::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0}
.page.L::after{background:linear-gradient(270deg,#000B,#0003 70%)}
.page.R::after{background:linear-gradient(90deg,#000B,#0003 70%)}
.t-cover{--bg:#17594A;--ttl:#F9BE1A;--sub:#FFFFFF}
.t-north{--bg:#A9CF7C;--ttl:#1F3D2B;--sub:#1F3D2B}
.t-central{--bg:#63C0D1;--ttl:#0E3E55;--sub:#0E3E55}
.t-south{--bg:#F5C543;--ttl:#7A2E12;--sub:#7A2E12}
.t-modern{--bg:#2B2350;--ttl:#FFD84A;--sub:#5FE3F0}
@media (min-width:641px){
  .menu{padding:16px;gap:12px}
  .msign h2{font-size:30px}
  .msign p{font-size:13px}
  .ribbons{flex-wrap:wrap;overflow:visible}
  .book{grid-template-columns:1fr 1fr}
  .book::after{display:block}
  .page{--band:clamp(62px,13vw,124px);--mar:clamp(22px,5.5vw,62px);--foot:clamp(34px,7vw,72px)}
  .page.t-south,.page.t-modern{--band:clamp(70px,16vw,150px)}
  .page.L{grid-column:1;transform-origin:right center;border-radius:14px 0 0 14px}
  .page.R{grid-column:2;transform-origin:left center;border-radius:0 14px 14px 0}
}

/* page turn: the outgoing page and the incoming one are the two faces of the same leaf, swinging on the spine */
.page.turn{z-index:3}
.outR{animation:outR .85s cubic-bezier(.42,.05,.4,1) forwards}
.inL{animation:inL .85s cubic-bezier(.42,.05,.4,1) forwards}
.outL{animation:outL .85s cubic-bezier(.42,.05,.4,1) forwards}
.inR{animation:inR .85s cubic-bezier(.42,.05,.4,1) forwards}
.outR::after,.outL::after{animation:shadeIn .85s cubic-bezier(.42,.05,.4,1) forwards}
.inL::after,.inR::after{animation:shadeOut .85s cubic-bezier(.42,.05,.4,1) forwards}
.covered::after{animation:dim .85s ease-in forwards}
.revealed::after{animation:undim .85s ease-out forwards}
@keyframes outR{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
@keyframes inL{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
@keyframes outL{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
@keyframes inR{from{transform:rotateY(-180deg)}to{transform:rotateY(0)}}
@keyframes shadeIn{from{opacity:0}50%{opacity:.55}to{opacity:.55}}
@keyframes shadeOut{from{opacity:.55}50%{opacity:.55}to{opacity:0}}
@keyframes dim{from{opacity:0}to{opacity:.45}}
@keyframes undim{from{opacity:.45}to{opacity:0}}

/* page furniture */
.art{display:block}
.in{display:block}
.band{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;padding:6px 10px 0;min-width:0}
.tt{align-self:center;min-width:0}
.ttl{font-family:var(--display);font-weight:400;font-size:clamp(15px,9cqw,36px);line-height:1;margin:0;color:var(--ttl);letter-spacing:.5px}
.psub{display:block;font-weight:600;font-size:clamp(10px,4.2cqw,15px);color:var(--sub);margin-top:2px}
.mark{margin-right:auto;align-self:center;font-family:var(--display);font-size:clamp(10px,5.4cqw,22px);line-height:1.1;color:var(--ttl);text-wrap:balance;min-width:0}
.band .small{height:72%;flex:none}
.band .land{height:94%;flex:none}
.band .small,.band .land{margin-bottom:5px}
.band .s2{height:56%}
.band .s2.top{align-self:flex-start;margin-top:-6px}
.R .band{justify-content:flex-end;gap:clamp(8px,6cqw,44px)}
.band .small svg,.band .land svg{height:100%;width:auto}
.margin{grid-row:2;display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:6px 0}
.margin .in{width:86%}
.margin svg{width:100%;height:auto}
.L .margin{grid-column:1}.L .panel{grid-column:2}
.R .margin{grid-column:2}.R .panel{grid-column:1}
.panel{grid-row:2;position:relative;min-width:0;padding:10px 8px 10px 15%;color:var(--paper-ink)}
.R .panel{padding:10px 15% 10px 8px}
.scal{position:absolute;inset:0;width:100%;height:100%}
.R .scal{transform:scaleX(-1)}
.cards{position:relative;height:100%;display:flex;flex-direction:column;justify-content:space-evenly;gap:4px}
.pfoot{grid-column:1/-1;position:relative}
.water{position:absolute;inset:0;width:100%;height:100%;display:block}
.pfoot .obj{position:absolute;bottom:10%;height:90%;z-index:1}
.pfoot .obj svg{height:100%;width:auto}
.L .pfoot .obj{left:16%}.R .pfoot .obj{right:16%}

/* dish cards: the drawn bowl, the name with your best time, and the rule */
.card{position:relative;display:grid;grid-template-columns:clamp(34px,23cqw,72px) minmax(0,1fr);gap:6px;align-items:center;text-align:left;
  padding:4px 6px;border-radius:10px;border:1.5px solid transparent;background:transparent;color:var(--paper-ink);cursor:pointer;
  font:600 clamp(12px,3.6cqw,16px)/1.25 var(--body);transition:transform .15s,background .15s,box-shadow .15s}
.card:hover{background:#F9BE1A40;transform:translateY(-2px);box-shadow:0 4px 0 #10312A22}
.card:active{transform:scale(.96)}
.card.sel{background:var(--gold);border-color:var(--paper-ink)}
.pic{position:relative;display:block}
.pic svg.bowlpic{display:block;width:100%;height:auto;transition:transform .2s}
.card:hover .bowlpic{transform:translateY(-3px) rotate(-4deg)}
.card.hop .bowlpic{animation:hop .5s}
.st{position:absolute;left:25%;top:-18%;width:50%;opacity:0;transition:opacity .2s}
.card:hover .st,.card.sel .st{opacity:1}
.st path{animation:steam 1.4s ease-in-out infinite}
.st path+path{animation-delay:.5s}
.txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.crule{display:none;font-weight:400;font-size:12px;line-height:1.35;color:var(--paper-soft)}
.card.sel .crule{color:var(--paper-ink)}
@container (min-width:300px){.crule{display:block}}
.cbest{font-weight:400;font-size:.8em;color:var(--paper-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.card[aria-pressed="true"]{border-color:var(--paper-ink);border-style:dashed}
.how{display:grid;grid-template-columns:clamp(30px,17cqw,56px) minmax(0,1fr);gap:8px;align-items:center;font-size:clamp(11px,3.4cqw,15px);line-height:1.35;padding:2px 4px}
.how svg{width:100%;height:auto;display:block}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes steam{0%{transform:translateY(4px);opacity:0}40%{opacity:1}100%{transform:translateY(-5px);opacity:0}}

/* corners that turn the page */
.corner{position:absolute;bottom:0;width:clamp(26px,5.5vw,48px);height:clamp(26px,5.5vw,48px);border:0;padding:0;cursor:pointer;z-index:6;transition:transform .2s;animation:peek 2.6s ease-in-out infinite}
.corner.next{right:0;transform-origin:100% 100%;border-radius:0 0 14px 0;background:linear-gradient(315deg,var(--wall) 45%,#B9AE8E 46%,#FFF8E6 58%,#FFF8E6 62%,#0000 63%)}
.corner.prev{left:0;transform-origin:0 100%;border-radius:0 0 0 14px;background:linear-gradient(45deg,var(--wall) 45%,#B9AE8E 46%,#FFF8E6 58%,#FFF8E6 62%,#0000 63%)}
.corner:hover{transform:scale(1.45);animation:none}
@keyframes peek{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}

/* living illustrations */
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite}
.swing{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite}
.swing:nth-of-type(2n){animation-duration:3.9s;animation-direction:reverse}
.band{position:relative}
.band .edge{position:absolute;top:0;right:0;bottom:0;width:min(56%,calc(var(--band) * 1.8))}
.band .edge svg{width:100%;height:100%}
.band .s3{height:94%}
@container (max-width:300px){.band .s2,.band .s3{display:none}}
.ttl.rg{font-size:clamp(20px,11.5cqw,54px)}
.ttl small{display:block;font-size:.4em;letter-spacing:1.5px;line-height:1.15}
.ttl .big{display:block;padding-top:.34em;line-height:1}
.L .pfoot .obj.trav{left:0;right:0}
.trav .sail{display:block;position:absolute;bottom:0;height:100%;left:30%;animation:travel 26s linear infinite}
@keyframes travel{from{left:-28%}to{left:102%}}
.oar{transform-box:view-box;transform-origin:33px 31px;animation:row 1.6s ease-in-out infinite}
@keyframes row{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
.drift{animation:drift 9s ease-in-out infinite}
.glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
.branch{transform-box:fill-box;transform-origin:100% 0;animation:sway 5s ease-in-out infinite}
.birds{animation:birds 6s ease-in-out infinite}
@keyframes birds{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-4px)}}
.flap{transform-box:fill-box;transform-origin:0 50%;animation:flap 1.8s ease-in-out infinite}
.bob{transform-box:fill-box;transform-origin:50% 50%;animation:bob 2.8s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 14s linear infinite}
.tick{transform-origin:70px 39px;animation:spin 8s linear infinite}
.bloom{transform-box:fill-box;transform-origin:50% 100%;animation:bloom 4s ease-in-out infinite}
.flick{animation:flick 2.3s steps(1) infinite}
.flick2{animation:flick 3.1s steps(1) infinite .7s}
.puff{animation:steam 1.8s ease-in-out infinite}
.wv{animation:wave linear infinite}
.w1{animation-duration:7s}.w2{animation-duration:5s;animation-direction:reverse}.w3{animation-duration:3.6s}
.dash{animation:dash 1s linear infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes flap{0%,100%{transform:skewY(0)}50%{transform:skewY(-7deg) scaleX(.94)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2.5px) rotate(2deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bloom{0%,100%{transform:scale(1)}50%{transform:scale(1.07,1.03)}}
@keyframes flick{0%,100%{opacity:1}45%{opacity:1}50%{opacity:.25}55%{opacity:1}80%{opacity:.5}85%{opacity:1}}
@keyframes wave{to{transform:translateX(-50px)}}
@keyframes dash{to{transform:translateX(-40px)}}
.page.enter .in{animation:rise .6s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:calc(var(--i)*80ms)}
@keyframes rise{from{opacity:.4;transform:translateY(18px) scale(.6)}}

/* under the book */
.turns{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600}
.chip[disabled]{opacity:.35;cursor:default}
/* food passport: how many of the dishes you have cleaned */
.pass{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px}
.pass svg{flex:none;width:28px;height:28px}
.pass .t{flex:1;min-width:0}
.pass b{display:block;font-size:14px}
.pass .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:5px}
.pass .bar i{display:block;height:100%;background:var(--sign);width:0;transition:width .4s}
.pass .n{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
/* the dish slip: on a wide screen it lands, taped, on the opposite page; on a phone the same slip slides up as a sheet */
.menuwrap{--B:#A9C97E;--T:#7CCBD3;--N:#F5AAA6;--V:#F4B55E}
.page.under .panel .cards,.page.under .margin{opacity:.35}
.book.slipon .corner{visibility:hidden}
.slip{position:absolute;inset:14px 10px 8px 8px;z-index:7;background:#FFFFFF;color:#10312A;border:2px solid #10312A;border-radius:10px;box-shadow:-6px 6px 0 #10312A33;
  transform:rotate(1.2deg);display:flex;flex-direction:column;animation:land .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes land{from{transform:translateY(-14px) rotate(-2deg) scale(1.04);opacity:0}}
.slip .tape{position:absolute;top:-9px;left:50%;width:70px;height:20px;margin-left:-35px;background:#F9BE1AD9;transform:rotate(-3deg);z-index:1}
.sbody{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.sx{position:absolute;top:6px;right:6px;z-index:2;width:30px;height:30px;border:0;border-radius:50%;background:#FFFFFFE6;color:#10312A;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sx svg{width:16px;height:16px}
.sph{position:relative;flex:none;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--tint);display:flex;align-items:center;justify-content:center}
.sph img{width:100%;height:100%;object-fit:cover;display:block}
.sph svg.bowl{width:62%;height:auto}
.snav{position:absolute;top:50%;margin-top:-18px;width:36px;height:36px;border:0;border-radius:50%;background:#FFFFFFE6;color:#10312A;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px #0003}
.snav svg{width:18px;height:18px}
.snav.sp{left:8px}.snav.sn{right:8px}
.bigstamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-14deg);border:5px solid var(--sign);color:var(--sign);background:#FFFFFFD9;border-radius:10px;padding:4px 16px;font-family:var(--display);font-size:30px;line-height:1.1;pointer-events:none;white-space:nowrap}
.bigstamp.go{animation:bstamp .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes bstamp{from{transform:translate(-50%,-50%) rotate(-14deg) scale(2.4);opacity:0}}
.swhere{margin:0;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--sign)}
.swhere svg{width:13px;height:13px;flex:none}
.sname{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(20px,6cqw,28px);line-height:1.05;text-wrap:balance}
.sone{margin:0;font-size:14px;line-height:1.45}
.sing{display:flex;flex-wrap:wrap;gap:5px;margin:0;padding:0;list-style:none}
.sing li{background:#E1F0E6;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.srule{margin:0;display:flex;gap:6px;font-size:12px;line-height:1.4;color:#4B6B62}
.srule svg{flex:none;width:15px;height:15px;margin-top:1px}
.sfa{margin:0;font-size:14px;line-height:1.45;animation:fadeup .25s ease-out}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}}
.srow{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1.5px dashed #10312A22;padding-top:10px}
.sfq{border:0;background:none;padding:0;font:700 13px var(--body);color:var(--sign);display:flex;align-items:center;gap:4px;cursor:pointer}
.sfq svg{width:14px;height:14px;transition:transform .2s}
.sfq[aria-expanded="true"] svg{transform:rotate(180deg)}
.sgo{font:400 15px var(--display);background:var(--gold);border:2px solid #10312A;border-radius:8px;padding:8px 14px;color:#10312A;cursor:pointer;white-space:nowrap}
.sgo:active{transform:scale(.97)}
.sgo .p,.grab{display:none}
.sheetveil{position:fixed;inset:0;z-index:30;background:#0A1E1A66;opacity:0;transition:opacity .25s}
.sheetveil.on{opacity:1}
.slip.sheet{position:fixed;inset:auto 0 0 0;z-index:31;max-height:88vh;border:0;border-radius:18px 18px 0 0;box-shadow:0 -6px 24px #0004;
  transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1.05);animation:none}
.slip.sheet.on{transform:none}
.slip.sheet .tape,.slip.sheet .sx{display:none}
.slip.sheet .grab{display:block;flex:none;padding:6px 0 2px}
.grab button{display:block;width:44px;height:18px;margin:0 auto;border:0;background:none;cursor:pointer;position:relative}
.grab button::before{content:"";position:absolute;left:5px;right:5px;top:7px;height:4px;border-radius:2px;background:#B4B2A9}
.slip.sheet .sbody{padding:4px 12px 14px}
.slip.sheet .sph{aspect-ratio:16/10}
.slip.sheet .snav{display:flex}
.slip.sheet .srow{flex-direction:column;align-items:stretch}
.slip.sheet .sfq{align-self:flex-start}
.slip.sheet .sgo{font-size:17px;padding:12px}
.slip.sheet .sgo .w{display:none}
.slip.sheet .sgo .p{display:inline}
.mOut{animation:outR .7s cubic-bezier(.42,.05,.4,1) forwards}
.mIn{animation:inR .7s cubic-bezier(.42,.05,.4,1) forwards}
.mOut::after{animation:shadeIn .7s cubic-bezier(.42,.05,.4,1) forwards}
.mIn::after{animation:shadeOut .7s cubic-bezier(.42,.05,.4,1) forwards}
@media (prefers-reduced-motion:reduce){.menuwrap *,.menuwrap *::before,.menuwrap *::after{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="top">
  <!-- one centred column: the sign, a row of small tools, the dish and its rule, the bowl, then one round button -->
  <header class="sign">
    <h1>Húp Phở</h1>
    <p data-en="31 bowls, one rule each. First to empty the bowl wins.">31 tô, mỗi tô một luật. Ai sạch tô trước thì thắng.</p>
  </header>

  <nav class="tools" aria-label="Chọn tô" data-en-label="Choose a bowl">
    <button class="pill daily" id="dailybtn" type="button" data-en="Daily bowl">Tô hôm nay</button>
    <span class="tright">
      <button class="pill ghost" id="tomenu" type="button" aria-haspopup="dialog" aria-label="Thực đơn 31 tô" data-en-label="Menu: 31 bowls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4.3 9.2 4.3 12 6c2.8-1.7 5.5-1.7 8-.5V19c-2.5-1.2-5.2-1.2-8 .5-2.8-1.7-5.5-1.7-8-.5zM12 6v13.5"/></svg><span data-en="31 bowls">31 tô</span></button>
      <button class="round" id="sndbtn" type="button" aria-label="Tiếng"></button>
      <button class="round" id="themebtn" type="button" aria-label="Giao diện"></button>
      <button class="round" id="langbtn" type="button" aria-label="Switch to English">VI</button>
    </span>
  </nav>

  <div class="dishhead">
    <div class="dishrow">
      <button class="arrow" id="prev" type="button" aria-label="Tô trước" data-en-label="Previous bowl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 class="dish" id="dish" aria-live="polite">Phở bò</h2>
      <button class="arrow" id="next" type="button" aria-label="Tô sau" data-en-label="Next bowl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <p class="sub"><span id="best">Chưa có kỷ lục</span><span id="hud"></span></p>
  </div>

  <!-- play with someone: up top so it's seen at a glance; hidden while the duel box is in use -->
  <div class="duelrow" id="duelrow">
    <button class="quiet duelbtn" id="duelbtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l9 9M13 13l-2.5 2.5M13 13l2.5-2.5M20 4l-9 9M11 13l2.5 2.5M11 13l-2.5-2.5M6 18l-2 2M18 18l2 2"/></svg><span data-en="Find opponent">Tìm đối thủ</span></button>
    <button class="quiet duelbtn" id="invitebtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span data-en="Challenge a friend">Thách bạn</span></button>
  </div>

  <section class="duel" id="duel" hidden aria-live="polite">
    <div class="duelhead">
      <span class="me"><span data-en="You">Bạn</span>: <b id="dmyname"></b> <button class="linkbtn" id="dreroll" type="button" data-en="new name">đổi tên</button></span>
      <button class="chip" id="dleave" type="button" data-en="Leave">Rời trận</button>
    </div>
    <div class="opp" id="opp" hidden>
      <span class="opic" id="opic"></span>
      <span class="oname"><span id="oname"></span><span class="otag" id="otag"></span></span>
      <span class="otime" id="otime"></span>
      <div class="olevel" aria-hidden="true"><i id="obar"></i></div>
      <span class="ostat" id="ostat"></span>
    </div>
    <div class="dmsg" id="dmsg"></div>
    <!-- Thách đấu: the private room's link, to send to a friend -->
    <div class="dinvite" id="dinvite" hidden>
      <input id="dlink" type="text" readonly aria-label="Link thách đấu" data-en-label="Challenge link">
      <button class="chip dsend" id="dsend" type="button" data-en="Send link">Gửi link</button>
    </div>
  </section>

  <div class="table">
    <div class="count" id="count" hidden aria-live="assertive"></div>
    <svg viewBox="0 0 320 240" role="img" aria-label="Tô mì. Chạm vào tô để gắp xương." data-en-label="Bowl of noodles. Tap the bowl to pick out bones." id="svg">
      <defs><clipPath id="lvclip"><rect id="lvrect" x="0" y="98" width="320" height="150"/></clipPath></defs>
      <g id="bowl">
        <g id="steam" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" opacity=".9">
          <path d="M120 58 q-10 -13 0 -26 q10 -13 0 -26"/><path d="M160 54 q-10 -13 0 -26 q10 -13 0 -26"/><path d="M200 58 q-10 -13 0 -26 q10 -13 0 -26"/>
        </g>
        <g id="mom" opacity="0">
          <ellipse cx="128" cy="26" rx="20" ry="13" fill="#fff" stroke="#10312A" stroke-width="3"/><ellipse cx="192" cy="26" rx="20" ry="13" fill="#fff" stroke="#10312A" stroke-width="3"/>
          <circle cx="130" cy="30" r="6" fill="#10312A"/><circle cx="190" cy="30" r="6" fill="#10312A"/>
          <path d="M106 8 l40 8 M214 8 l-40 8" stroke="#10312A" stroke-width="4" stroke-linecap="round"/>
        </g>
        <g id="vessel"></g>
        <g id="strand" fill="none" stroke-linecap="round" opacity="0"></g>
        <g id="longn" fill="none" stroke-linecap="round" opacity="0" stroke-dasharray="100">
          <path id="ln1" pathLength="100" d="M160 106 q-14 -17 0 -34 q14 -17 0 -34 q-14 -17 0 -34" stroke="#10312A"/>
          <path id="ln2" pathLength="100" d="M160 106 q-14 -17 0 -34 q14 -17 0 -34 q-14 -17 0 -34"/>
        </g>
      </g>
    </svg>
    <!-- the old bars, kept off screen: the ring around the button now shows the bowl and the air -->
    <div class="gauges" aria-hidden="true"><i id="bar"></i><i id="breath"></i></div>
  </div>

  <div class="msg" id="msg" role="status"></div>

  <!-- the round button: "HÚP" before a run, the clock during one. The outer ring is what is left in the bowl, the inner ring your air -->
  <div class="hupwrap">
    <svg class="ring" viewBox="0 0 132 132" aria-hidden="true">
      <circle class="rtrack" cx="66" cy="66" r="61"/><circle class="rbowl" id="rbowl" cx="66" cy="66" r="61" pathLength="100"/>
      <circle class="rtrack thin" cx="66" cy="66" r="53"/><circle class="rair" id="rair" cx="66" cy="66" r="53" pathLength="100"/>
    </svg>
    <button class="hup" id="slurp" type="button"><span class="hword">HÚP</span><span class="clock" id="clock">0,00</span><span class="hlabel" id="slabel">Bắt đầu húp</span></button>

  /* what each dish is, where it is from, what is in it, and one fact behind a tap */
  var INFO={
    phobo:['pho-bo','Hà Nội · Nam Định','Hà Nội · Nam Định','Món nước biểu tượng của Việt Nam: nước xương bò hầm nhiều giờ với quế, hồi và gừng nướng.','Vietnam\'s signature noodle soup: beef bone broth simmered for hours with cinnamon, star anise and charred ginger.',[['Bánh phở','Flat rice noodles'],['Bò tái, nạm','Rare beef, brisket'],['Quế, hồi','Cinnamon, star anise']],'Phở ra đời ở miền Bắc đầu thế kỷ 20, rồi theo người di cư vào Nam và ra khắp thế giới.','Phở was born in northern Vietnam in the early 20th century, then travelled south and around the world with migrants.','Luật cơ bản. Tô để làm quen.','Basic rules. The warm-up bowl.'],
    phoga:['pho-ga','Hà Nội','Hà Nội','Phở với nước dùng gà trong, thịt gà xé và lá chanh thái chỉ.','Phở with a clear chicken broth, shredded chicken and fine strips of lime leaf.',[['Bánh phở','Flat rice noodles'],['Gà ta','Free-range chicken'],['Lá chanh','Lime leaf']],'Người Hà Nội ăn phở gà với lá chanh thái sợi, thứ hiếm thấy trên tô phở bò.','In Hà Nội, chicken phở comes with shredded lime leaf, which you rarely see on beef phở.','Quẩy nổi liên tục. Húp trúng càng nhiều càng nhanh.','Quẩy keeps floating up. Catch as many as you can.'],
    buncha:['bun-cha','Hà Nội','Hà Nội','Chả heo nướng than, ăn với bún và rau sống, chấm nước mắm chua ngọt.','Charcoal-grilled pork with rice vermicelli and herbs, dipped in a sweet and sour fish sauce.',[['Chả nướng','Grilled pork'],['Bún','Rice vermicelli'],['Nước chấm','Dipping sauce']],'Năm 2016, Tổng thống Mỹ Barack Obama và đầu bếp Anthony Bourdain cùng ăn bún chả ở một quán bình dân Hà Nội.','In 2016, US President Barack Obama and chef Anthony Bourdain shared bún chả at a simple Hà Nội eatery.','Chấm từng gắp: mỗi hơi tối đa 1 giây.','One dip at a time: each slurp lasts 1 second at most.'],
    bunrieu:['bun-rieu','Đồng bằng Bắc Bộ','Red River Delta','Nước dùng chua nhẹ từ cà chua và cua đồng giã nhuyễn.','A gently sour soup of tomato and pounded paddy crab.',[['Riêu cua','Paddy crab'],['Cà chua','Tomato'],['Đậu rán','Fried tofu']],'Cua đồng sống ở ruộng lúa; người ta giã cả con rồi lọc lấy nước để nấu riêu.','Paddy crabs live in rice fields; they are pounded whole and strained to make the broth.','Phải húp đủ 3 miếng topping mới sạch tô.','Eat 3 toppings before the bowl can be finished.'],
    bundau:['bun-dau-mam-tom','Hà Nội','Hà Nội','Bún lá, đậu rán giòn và thịt luộc, chấm mắm tôm đánh với chanh.','Pressed vermicelli, crispy tofu and boiled pork, dipped in shrimp paste whipped with lime.',[['Bún lá','Pressed vermicelli'],['Đậu rán','Fried tofu'],['Mắm tôm','Shrimp paste']],'Mắm tôm rất nồng; người Hà Nội đánh với chanh, đường, ớt đến khi sủi bọt.','Shrimp paste smells strong; locals whip it with lime, sugar and chili until it foams.','Mắm tôm nồng: hồi hơi chậm gấp đôi.','Shrimp paste is strong: breath recovers half as fast.'],
    bunthang:['bun-thang','Hà Nội','Hà Nội','Bún tinh tế với nước dùng thật trong và nhiều loại topping thái sợi.','A refined noodle soup with a crystal-clear broth and finely shredded toppings.',[['Trứng tráng','Egg omelette'],['Giò lụa, gà','Pork sausage, chicken'],['Tôm ruốc','Shrimp floss']],'Chữ "thang" ví món ăn như một thang thuốc: nhiều vị phối đúng tỉ lệ.','The name likens it to a herbal remedy ("thang"): many ingredients in exact proportion.','Toàn sợi dài. Gần như hơi nào cũng phải trọn.','Almost all long noodles. Finish each in one breath.'],
    bunoc:['bun-oc','Hà Nội','Hà Nội','Ốc trong nước dùng chua từ cà chua và giấm bỗng.','River snails in a sour broth of tomato and fermented rice vinegar.',[['Ốc','River snails'],['Giấm bỗng','Rice vinegar'],['Tía tô','Perilla']],'Giấm bỗng làm từ bã rượu nếp, cho vị chua thơm rất riêng.','Giấm bỗng is made from rice-wine dregs, giving a fragrant sourness.','Vỏ ốc lẫn trong tô: chạm để gắp ra.','Snail shells hide in the bowl: tap to pick them out.'],
    mienluon:['mien-luon','Hà Nội','Hà Nội','Miến dong với lươn chiên giòn, ăn khô hoặc chan nước.','Glass noodles with crispy fried eel, eaten dry or in broth.',[['Miến dong','Glass noodles'],['Lươn chiên','Fried eel'],['Hành phi','Fried shallots']],'Miến làm từ củ dong riềng nên sợi trong và dai.','The noodles are made from canna starch, which makes them clear and chewy.','Miến trơn: ngừng húp là tuột lại vào tô.','Slippery noodles slide back if you stop.'],
    banhdacua:['banh-da-cua','Hải Phòng','Hải Phòng','Sợi bánh đa đỏ dai trong nước riêu cua, kèm chả lá lốt.','Chewy red-brown rice noodles in crab broth, with betel-leaf rolls.',[['Bánh đa đỏ','Red rice noodles'],['Riêu cua','Crab'],['Chả lá lốt','Betel-leaf rolls']],'Bánh đa có màu nâu đỏ nhờ trộn mật mía vào bột gạo.','The noodles get their red-brown colour from sugarcane molasses in the rice dough.','Sợi bản to: nửa giây đầu mỗi hơi chưa ăn thua.','Wide noodles: the first half-second of each slurp doesn\'t count.'],
    vanthan:['mi-van-than','Hà Nội','Hà Nội','Mì trứng, hoành thánh và xá xíu, gốc từ bếp người Hoa.','Egg noodles with wontons and char siu, from Chinese-Vietnamese cooking.',[['Mì trứng','Egg noodles'],['Hoành thánh','Wontons'],['Xá xíu','Char siu']],'"Vằn thắn" là cách người Hà Nội gọi hoành thánh, tức wonton.','"Vằn thắn" is the Hà Nội way of saying wonton.','Cà rốt cam trông như ớt nhưng vô hại.','Orange carrot looks like chili but is harmless.'],
    bbh:['bun-bo-hue','Huế','Huế','Nước dùng sả, mắm ruốc và ớt, sợi bún to, cay đậm.','A spicy broth of lemongrass, fermented shrimp sauce and chili, with thick round noodles.',[['Sả','Lemongrass'],['Bắp bò, giò heo','Beef shank, pork trotter'],['Mắm ruốc','Shrimp sauce']],'Huế từng là kinh đô triều Nguyễn, nên ẩm thực nơi đây cầu kỳ và cay hơn hẳn.','Huế was the Nguyễn dynasty\'s capital, and its cooking is famously elaborate and spicy.','Ớt gấp đôi. Sợi to, húp dài mới đã.','Double chili. Thick noodles reward long slurps.'],
    miquang:['mi-quang','Quảng Nam','Quảng Nam','Sợi mì vàng bản to, chan ít nước, ăn với bánh tráng mè.','Wide yellow noodles with just a little broth, eaten with a sesame rice cracker.',[['Mì nghệ','Turmeric noodles'],['Tôm, thịt','Prawns, pork'],['Bánh tráng mè','Sesame cracker']],'Nước dùng mì Quảng gọi là "nhưn", chỉ vừa láng mặt sợi.','The broth, called "nhưn", only just covers the noodles.','Tô chỉ đầy 70%, nhưng hụt hơi rất nhanh.','Only 70% full, but you run out of breath fast.'],
    caolau:['cao-lau','Hội An','Hội An','Sợi dai vàng nâu, xá xíu và bánh giòn, gần như không có nước.','Chewy yellow-brown noodles with char siu and crunchy crackers, almost no broth.',[['Sợi cao lầu','Cao lầu noodles'],['Xá xíu','Char siu'],['Rau Trà Quế','Trà Quế herbs']],'Người Hội An kể sợi cao lầu chuẩn phải dùng nước tro và nước giếng Bá Lễ.','Locals say true cao lầu needs ash-water and water from the old Bá Lễ well.','Sợi dai: hơi ngắn gần như vô ích.','Chewy: short slurps barely work.'],
    bunchaca:['bun-cha-ca','Đà Nẵng','Đà Nẵng','Chả cá chiên trong nước dùng ngọt thanh, có thơm và cà chua.','Fried fish cake in a light, sweet broth with pineapple and tomato.',[['Chả cá','Fish cake'],['Thơm','Pineapple'],['Cà chua','Tomato']],'Nước dùng ninh từ xương cá và rau củ nên ngọt thanh.','The broth is simmered from fish bones and vegetables, so it tastes light and sweet.','Có xương cá: chạm để gắp ra. Ớt vẫn nổi.','Fish bones to tap out, and chili as usual.'],
    banhcanh:['banh-canh','Miền Trung','Central Vietnam','Sợi to, mềm làm từ bột gạo hoặc bột lọc, nước dùng sánh.','Thick soft noodles of rice or tapioca flour in a thick broth.',[['Sợi bánh canh','Thick noodles'],['Cua, tôm','Crab, prawns'],['Trứng cút','Quail eggs']],'Mỗi vùng một kiểu bánh canh: cua, cá lóc, chả cá, ghẹ.','Every region has its own version: crab, snakehead fish, fish cake, blue crab.','Sợi nở dần: để lâu tô đầy lại.','Noodles swell: the bowl slowly refills.'],
    bunhen:['bun-hen','Huế','Huế','Bún trộn hến xào, tóp mỡ, đậu phộng, kèm chén nước hến.','Vermicelli tossed with baby clams, pork crackling and peanuts, with a cup of clam broth.',[['Hến','Baby clams'],['Tóp mỡ','Pork crackling'],['Bánh tráng','Rice cracker']],'Hến nổi tiếng nhất lấy từ cồn Hến trên sông Hương.','The best-known clams come from Cồn Hến, an islet on the Perfume River.','Phải húp đủ 5 con hến mới sạch tô.','Eat 5 clams before the bowl can be finished.'],
    phokho:['pho-kho-gia-lai','Pleiku, Gia Lai','Pleiku, Gia Lai','Còn gọi là phở hai tô: một tô phở trộn khô, một tô nước riêng.','Also called "two-bowl phở": dry tossed noodles, and broth in a separate bowl.',[['Sợi phở nhỏ','Thin phở noodles'],['Thịt bằm','Minced pork'],['Bò viên','Beef balls']],'Sợi phở ở đây nhỏ như sợi bún, khác hẳn bánh phở bản to miền Bắc.','The noodles here are thin like vermicelli, unlike the wide northern phở.','Hai tô: sạch tô khô rồi còn tô nước.','Two bowls: the dry one, then the broth.'],
    hutieunv:['hu-tieu-nam-vang','Sài Gòn','Saigon','Hủ tiếu dai trong nước xương heo, có tôm, thịt bằm và gan.','Chewy rice noodles in pork broth with prawns, minced pork and liver.',[['Hủ tiếu','Rice noodles'],['Tôm, gan','Prawns, liver'],['Hẹ','Garlic chives']],'"Nam Vang" là tên cũ của Phnom Penh: món này theo người Hoa từ Campuchia sang.','"Nam Vang" is the old name for Phnom Penh; the dish came with Chinese-Cambodian migrants.','Ớt hiểm: gần như không kịp báo trước.','Bird\'s-eye chili: almost no warning.'],
    hutieugo:['hu-tieu-go','Sài Gòn','Saigon','Tô hủ tiếu nhỏ, rẻ, bán rong trong hẻm.','A small, cheap bowl sold from carts in the alleys.',[['Hủ tiếu','Rice noodles'],['Thịt heo','Pork'],['Giá','Bean sprouts']],'Người bán gõ hai thanh tre "cắc cắc" để báo hàng đến, nên gọi là hủ tiếu gõ.','Vendors knock two bamboo sticks to announce themselves, hence "gõ" (knock).','Tô nhỏ, không ớt. Đua tốc độ thuần.','Small bowl, no chili. Pure speed.'],
    hutieukho:['hu-tieu-kho','Mỹ Tho · Sài Gòn','Mỹ Tho · Saigon','Hủ tiếu trộn nước sốt sền sệt, ăn kèm một chén nước lèo.','Noodles tossed in a thick savoury sauce, with a small bowl of broth on the side.',[['Hủ tiếu','Rice noodles'],['Nước sốt','Sauce'],['Chén nước lèo','Side broth']],'Ăn khô giữ sợi dai, còn chén nước để húp xen kẽ.','Eating it dry keeps the noodles chewy; the broth is sipped between bites.','Sợi trơn: húp ngắn, húp nước để giữ hơi.','Sauce-slick noodles: slurp short, sip broth to breathe.'],
    bunmam:['bun-mam','Sóc Trăng · Trà Vinh','Sóc Trăng · Trà Vinh','Nước dùng từ mắm cá linh, cá sặc, đậm vị miền Tây.','A broth of fermented linh and sặc fish, deeply Mekong Delta.',[['Mắm cá','Fermented fish'],['Heo quay, tôm','Roast pork, prawns'],['Cà tím','Eggplant']],'Món này mang đậm dấu ấn ẩm thực Khmer ở miền Tây.','It carries strong Khmer influence from the Mekong Delta.','Cô chủ chan thêm nước hai lần.','The vendor tops you up twice.'],
    phoxelua:['pho-xe-lua','Miền Nam','Southern Vietnam','Tô phở cỡ "xe lửa", to gấp mấy lần tô thường.','A "train-sized" bowl of phở, several times a normal portion.',[['Bánh phở','Flat rice noodles'],['Bò tái, nạm','Rare beef, brisket'],['Bò viên','Beef balls']],'','','Tô khổng lồ, gần gấp đôi. Giữ sức mà húp.','A giant bowl, nearly double. Pace yourself.'],
    bunthitnuong:['bun-thit-nuong','Sài Gòn','Saigon','Bún trộn thịt nướng sả, chả giò, đồ chua, rưới nước mắm.','Vermicelli with lemongrass-grilled pork, spring rolls and pickles, dressed with fish sauce.',[['Thịt nướng','Grilled pork'],['Chả giò','Spring rolls'],['Đồ chua','Pickles']],'Người miền Nam gọi nem rán là chả giò; món này ăn khô, không có nước.','Southerners call fried spring rolls chả giò; this dish has no broth.','Chanh nổi lên là phải húp ngay.','Slurp the lime when it floats, or it turns sour.'],
    bokho:['hu-tieu-bo-kho','Sài Gòn','Saigon','Bò hầm mềm với sả, hồi và ngũ vị, nước sốt đỏ cam.','Beef stewed tender with lemongrass, star anise and five-spice in a red-orange sauce.',[['Bò kho','Stewed beef'],['Cà rốt','Carrot'],['Húng quế','Thai basil']],'Bò kho hay ăn với bánh mì buổi sáng; ăn với hủ tiếu cũng phổ biến không kém.','Bò kho is often eaten with a baguette for breakfast; with noodles is just as popular.','Nóng hổi: 4 giây đầu chỉ húp hơi ngắn.','Piping hot: only short slurps for 4 seconds.'],
    bunsuong:['bun-suong','Trà Vinh','Trà Vinh','Bún với "suông": tôm và thịt giã nhuyễn, nặn cong như lưỡi liềm.','Noodle soup with "suông": pounded shrimp and pork shaped into curved crescents.',[['Suông tôm','Shrimp dumplings'],['Tôm','Prawns'],['Hẹ','Garlic chives']],'Đặc sản của Trà Vinh, nơi có đông đồng bào Khmer sinh sống.','A speciality of Trà Vinh, home to a large Khmer community.','Sợi dài, trơn: nhiều sợi dài và dễ tuột.','Long and slippery: many long noodles, and it slides back.'],
    mitom:['mi-tom','Khắp Việt Nam','All over Vietnam','Mì gói nấu vội, thêm trứng và rau, món quen của sinh viên.','Instant noodles cooked in a hurry with an egg and greens, the student staple.',[['Mì gói','Instant noodles'],['Trứng','Egg'],['Hành lá','Scallion']],'Việt Nam thuộc nhóm nước ăn mì gói nhiều nhất thế giới tính theo đầu người.','Vietnam is among the world\'s biggest instant-noodle eaters per person.','Mẹ ngó sang là phải ngừng.','Mom looks over: stop or get scolded.'],

      else if(ev&&ev.type==='lime')say(tx('Chanh! Húp ngay kẻo chua.','Lime! Slurp it before it turns sour.'));
      else if(ev&&ev.type==='treat')say(tx(W(d.treatName)+' kìa! Húp ngay.',W(d.treatName)+'! Slurp it now.'));
      else if(longN)say(longN.on?tx('Giữ hơi! Đừng ngắt.','Keep going! Don’t stop.'):(longN.wait?tx('Sợi dài! Nhả ra, lấy hơi đã.','Long noodle! Stop and take a breath first.'):tx('Sợi dài! Húp một hơi không ngắt.','Long noodle! Slurp it in one go.')));
      else if(lock)say(tx('Nhả ra rồi gắp miếng mới.','Let go, then take the next bite.'));
      else if(elapsed<flashUntil)say(flashText,flashHot);
      else if(d.needTreats&&treats<d.needTreats&&level<=.07)say(tx('Chờ '+W(d.treatName).toLowerCase()+' nổi lên rồi húp.','Wait for a '+W(d.treatName).toLowerCase()+' to float up, then slurp it.'));
      else say(slurping?tx('Sụt sụt sụt…','Sluuurp…'):tx('Thở xong chưa? Húp tiếp.','Caught your breath? Keep slurping.'));
      hud();
    }
    paintMode();
    var v=VES[vd.ves||'bowl'], ys=v.top+(1-level)*v.depth, sc=Math.max(.05,Math.min(v.maxRx,v.hw(ys)-4)/116), dy=ys-98;
    strand.setAttribute('opacity',slurping&&!longN&&!vd.plain?'1':'0');
    strand.setAttribute('transform','translate('+(Math.sin(now/40)*3).toFixed(1)+','+(dy-((now/6)%20)).toFixed(1)+')');
    var ln=$('longn');ln.setAttribute('opacity',longN?'1':'0');
    if(longN){
      ln.setAttribute('stroke-dashoffset',(-(longN.got/d.longLen)*100).toFixed(1));
      ln.setAttribute('transform','translate('+(Math.sin(now/(longN.on?40:160))*3).toFixed(1)+','+((v.top-98)+(ys-v.top)*.5).toFixed(1)+')');
    }
    var el=$('ev'),show=ev&&ev.type!=='mom';
    if(el)el.setAttribute('opacity',show?'1':'0');
    $('mom').setAttribute('opacity',ev&&ev.type==='mom'?'1':'0');
    fill.setAttribute('transform','translate(160,'+ys.toFixed(1)+') scale('+sc.toFixed(3)+') translate(-160,-98)');
    fill.setAttribute('opacity',Math.min(1,level/.05).toFixed(2));
    /* soups hide the word under the broth; dry food sits on a solid plate, so the word only fades in as the last bite goes */
    if(vd.dry)$('clean').setAttribute('opacity',Math.max(0,1-level/.05).toFixed(2));
    /* milestones: surface toppings get eaten one by one as the bowl drains */
    var nTop=topEls.length,left=Math.min(nTop,Math.ceil(level/Math.max(d.start,.01)*nTop-1e-6));
    if(left!==topLeft){
      for(var ti=0;ti<nTop;ti++)topEls[ti].setAttribute('opacity',ti<left?'1':'0');
      if(left<topLeft&&left>0&&started&&!done)beep(520+(nTop-left)*70,.09,'sine',.14);
      topLeft=left;
    }
    slurpSound(slurping,now);
    $('lvrect').setAttribute('y',ys.toFixed(1));
    var pct=Math.round(level/Math.max(d.start,.01)*100);
    if(pct!==ringPct){ringPct=pct;bar.style.width=pct+'%';$('rbowl').style.strokeDashoffset=String(100-pct);}
    var ring=stuck?['spice',(stuck.need-stuck.got)/stuck.need]:heat>0?['heat',heat]:[breath<.25?'low':'',breath],ap=ring[0]+Math.round(ring[1]*100);
    if(ap!==airPct){airPct=ap;$('breath').style.width=Math.round(breath*100)+'%';var ra=$('rair');ra.style.strokeDashoffset=String(100-Math.round(ring[1]*100));ra.setAttribute('class','rair'+(ring[0]?' '+ring[0]:''));}
    steam.setAttribute('opacity',vd.dry?'0':heat>0?'1':(.15+level*.75).toFixed(2));
    clock.textContent=fmt(elapsed);
    if(micOn)readMic();
    Duel.frame();
    requestAnimationFrame(tick);
  }

  /* "Bắt đầu húp": ask for the mic if it is off, measure the room for a second, then the run starts. Only real slurps drain the bowl. */
  slurpBtn.addEventListener('click',function(){
    audio();
    if(Duel.blocks())return;
    if(started&&!done)return;
    if(done)reset();
    if(micOn&&!calibrating){begin();return;}
    pendingStart=true;paintStart();
    if(!micOn)micStart();
  });
  $('sndbtn').addEventListener('click',function(){muted=!muted;store.mute=muted;save();paintSound();audio();});
  paintSound();
  /* light / dark: follows the phone until you tap; then your pick is kept (store.theme) */
  var sysDark=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):{matches:false};
  function isDark(){return store.theme?store.theme==='dark':sysDark.matches;}
  function paintTheme(){
    if(store.theme)document.documentElement.setAttribute('data-theme',store.theme);else document.documentElement.removeAttribute('data-theme');
    var dk=isDark(),b=$('themebtn');
    b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+(dk?'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>':'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>')+'</svg>';
    b.setAttribute('aria-label',dk?tx('Giao diện tối. Bấm để chuyển sang sáng','Dark mode. Tap for light'):tx('Giao diện sáng. Bấm để chuyển sang tối','Light mode. Tap for dark'));
  }
  $('themebtn').addEventListener('click',function(){store.theme=isDark()?'light':'dark';save();paintTheme();});
  if(sysDark.addEventListener)sysDark.addEventListener('change',function(){if(!store.theme)paintTheme();});
  paintTheme();
  function grab(){if(ev&&ev.type==='bone'&&!done){clearEv();flash(tx('Gắp '+W(d.boneName)+' ra rồi. Húp tiếp.','Picked out the '+W(d.boneName)+'. Keep slurping.'));}}
  svg.addEventListener('pointerdown',grab);
  window.addEventListener('keydown',function(e){if(!bookOpen&&(e.key==='x'||e.key==='X'))grab();});
  $('again').addEventListener('click',reset);
  $('dailybtn').addEventListener('click',function(){pick(dailyIdx,true);});
  $('prev').addEventListener('click',function(){pick((cur+DISHES.length-1)%DISHES.length,false);});
  $('next').addEventListener('click',function(){pick((cur+1)%DISHES.length,false);});
  $('rnext').addEventListener('click',function(){pick((cur+1)%DISHES.length,false);});
  $('tomenu').addEventListener('click',function(){Menu.open(1+['B','T','N','V'].indexOf(d.r));});
  $('howto').addEventListener('click',function(){Menu.open(0);});
  $('rclose').addEventListener('click',function(){result.hidden=true;});

  var actx=null,analyser=null,stream=null,buf=null,lo0=0,lo1=0,hi0=0,hi1=0,calN=0,calSum=0,calLo=0,calUntil=0,beepAt=null;
  /* turning the mic off mid-bowl pauses the run; "Bắt đầu húp" picks it up again */
  function micOff(text){
    micOn=false;micSlurp=false;micBlow=false;micCoughs=0;calibrating=false;pendingStart=false;
    if(started&&!done)started=false;
    try{if(stream)stream.getTracks().forEach(function(t){t.stop();});}catch(e){}
    try{if(actx)actx.close();}catch(e){}
    stream=null;actx=null;analyser=null;
    $('microw').hidden=true;micBtn.hidden=true;paintStart();
    say(text||(elapsed>0&&!done?pausedText():idleText()),!!text);
  }
  function micStart(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){micOff(tx('Trình duyệt này không cho dùng mic, nên chưa húp được. Hãy mở trang bằng Chrome hoặc Safari mới.','This browser can’t use the mic, so you can’t play yet. Open the page in a recent Chrome or Safari.'));return;}
    say(tx('Cho phép dùng mic để bắt đầu húp.','Allow the mic to start slurping.'));
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(s){
      stream=s;
      var AC=window.AudioContext||window.webkitAudioContext;actx=new AC();
      var src=actx.createMediaStreamSource(s);analyser=actx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.3;src.connect(analyser);if(actx.state==='suspended')actx.resume();
      buf=new Float32Array(analyser.frequencyBinCount);
      var hz=actx.sampleRate/analyser.fftSize;lo0=Math.ceil(250/hz);lo1=Math.floor(1000/hz);hi0=Math.ceil(2000/hz);hi1=Math.min(buf.length-1,Math.floor(8000/hz));
      calN=0;calSum=0;calLo=0;calUntil=performance.now()+1000;micOn=true;calibrating=true;
      $('microw').hidden=false;micBtn.hidden=false;$('mstate').textContent=tx('đo tiếng ồn…','measuring noise…');
      paintStart();say(tx('Im lặng một giây để đo tiếng ồn xung quanh.','Stay quiet for a second while we measure the room.'));
    }).catch(function(){
      micOff(tx('Chưa có mic thì chưa húp được. Cho phép mic trong trình duyệt rồi bấm "Bắt đầu húp" lại. Nếu trang không hỏi mic, hãy mở nó trên web riêng.','You need the mic to play. Allow it in your browser, then press "Start slurping" again. If the page never asks, open it on its own site.'));
    });
  }
  micBtn.addEventListener('click',function(){micOff();});
  /* Three sounds, all read from the same two bands (250 Hz–1 kHz and 2–8 kHz):
     - slurp: hiss. Loud above 2 kHz, noisy rather than tonal, not dominated by the voice band, and it lasts.
     - blow: wind on the mic. Loud and noisy, strongest below 1 kHz, and it lasts.
     - cough: a short noisy burst. Sharp start, back to quiet 110–480 ms later, not mostly hiss.
     Speech and music are tonal, whistles are tonal, claps and taps are too short, and the game's own beeps are tonal and ignored.
     The bowl's state decides which sound matters, so a sound that sits between two classes rarely costs anything. */
  /*SLURP-DETECT*/
  var det={hiF:-90,loF:-90,on:0,off:0,bl:0,blOff:0,burst:null,hush:0,lastLen:0,recent:[]};
  function micFeatures(db,l0,l1,h0,h1){
    var i,p,lo=0,hi=0,lg=0,llg=0,n=h1-h0+1,m=l1-l0+1;
    for(i=l0;i<=l1;i++){p=Math.pow(10,Math.max(-140,db[i])/10);lo+=p;llg+=Math.log(p);}
    for(i=h0;i<=h1;i++){p=Math.pow(10,Math.max(-140,db[i])/10);hi+=p;lg+=Math.log(p);}
    lo/=m;hi/=n;
    return {hi:10*Math.log10(hi),lo:10*Math.log10(lo),flat:Math.exp(lg/n)/hi,flatLo:Math.exp(llg/m)/lo};
  }
  function micCalibrate(hiF,loF){det.hiF=hiF;det.loF=loF;det.on=0;det.bl=0;det.burst=null;det.hush=0;det.wLock=0;det.recent=[];}
  function micJudge(f,now,beepAt){
    var exHi=f.hi-det.hiF,exLo=f.lo-det.loF,ex=Math.max(exHi,exLo),noisy=f.flat>.2||f.flatLo>.2;
    /* slurp and blow never overlap: 6 dB more in the low band makes it wind, never hiss */
    var loud=exHi>10,hissy=f.hi>f.lo-6&&f.flat>.2;
    /* wind on the mic is far stronger in the low band; 6 dB keeps a flat, slurp-like hiss from counting as a blow */
    var windy=exLo>12&&f.lo>=f.hi+6&&f.flatLo>.2;
    /* a blow's hissy start and tail must not count as a slurp: any wind locks slurps out for 0.4 s */
    if(windy)det.wLock=now+400;
    var windLock=now<(det.wLock||0);
    /* wind-ish: even loosely low-heavy within the last 0.3 s; a hot bowl only burns you for a clear, hiss-only slurp */
    if(exLo>12&&f.lo>=f.hi-3)det.wOff=now+300;
    var cough=false,b=det.burst;
    /* bursts: start with a jump of 12 dB or more within about 70 ms, and end once the sound falls 22 dB below
       its own peak (or to near quiet), so two quick coughs in a row still count as two */
    var low=Infinity;for(var k=0;k<det.recent.length;k++)low=Math.min(low,det.recent[k]);
    if(b){
      b.peak=Math.max(b.peak,ex);
      if(ex<Math.max(6,b.peak-22)){
        var len=now-b.t,nearBeep=beepAt!=null&&b.t>=beepAt-40&&b.t-beepAt<250;
        det.lastLen=len;
        if(len>=120&&len<=480&&b.noisy*2>=b.n&&b.tilt/b.n>-6&&!nearBeep)cough=true;
        det.burst=null;
      }else if(now-b.t>480)b.long=true;
      if(det.burst){b.n++;if(noisy)b.noisy++;b.tilt+=f.lo-f.hi;}
    }else if(ex>15&&ex-low>=12)det.burst={t:now,n:1,noisy:noisy?1:0,tilt:f.lo-f.hi,peak:ex};
    det.recent.push(ex);if(det.recent.length>4)det.recent.shift();
    /* a cough's breathy tail must not count as a slurp or a blow */
    if(cough)det.hush=now+300;
    var hush=now<det.hush;
    if(windLock)det.on=0;
    else if(loud&&hissy&&!hush){det.on++;det.off=now+160;}else if(hush||now>det.off)det.on=0;
    if(windy&&!hush){det.bl++;det.blOff=now+160;}else if(hush||now>det.blOff)det.bl=0;
    if(ex<6){det.hiF+=(f.hi-det.hiF)*.01;det.loF+=(f.lo-det.loF)*.01;}
    /* young: a burst under 480 ms old that may still turn out to be a cough; hazards wait for it before counting a slurp */
    var young=!!det.burst&&now-det.burst.t<=480;
    return {loud:loud||exLo>12,hissy:hissy,windy:windy,slurp:det.on>=8,blow:det.bl>=8,cough:cough,young:young,windish:now<(det.wOff||0),exHi:exHi,exLo:exLo};
  }
  /*END-SLURP-DETECT*/
  function readMic(){
    if(!analyser)return;
    analyser.getFloatFrequencyData(buf);
    var f=micFeatures(buf,lo0,lo1,hi0,hi1),now=performance.now();
    if(now<calUntil){calSum+=f.hi;calLo+=f.lo;calN++;micSlurp=false;micBlow=false;return;}
    if(calibrating){
      if(calN)micCalibrate(calSum/calN,calLo/calN);calN=0;calibrating=false;
      if(pendingStart)begin();else paintStart();
    }
    var j=micJudge(f,now,beepAt);micSlurp=j.slurp;micBlow=j.blow;micYoung=j.young;micWindish=j.windish;if(j.cough)micCoughs++;
    $('mlevel').style.width=Math.max(0,Math.min(100,Math.max(j.exHi,j.exLo)/20*100)).toFixed(0)+'%';
    $('mstate').textContent=j.cough?tx('nghe thấy ho','cough heard'):micSlurp?tx('nghe thấy húp','slurp heard'):micBlow?tx('nghe thấy thổi','blow heard'):(j.loud&&!j.hissy&&!j.windy?tx('có tiếng, nhưng không phải húp, thổi hay ho','sound, but not a slurp, blow or cough'):tx('đang nghe','listening'));
    if(debugEl)paintDebug(f,j,now);
  }
  /* ?debug: live numbers for tuning the detector on a real phone */
  var debugEl=/[?&]debug\b/.test(location.search)?document.createElement('pre'):null,dbgCoughs=0,dbgLast='';
  if(debugEl){debugEl.className='debug';document.body.appendChild(debugEl);}
  function paintDebug(f,j,now){
    if(j.cough){dbgCoughs++;dbgLast='cough '+Math.round(det.lastLen)+' ms';}
    else if(!det.burst&&det.lastLen&&dbgLast.indexOf(Math.round(det.lastLen)+' ms')<0)dbgLast='burst '+Math.round(det.lastLen)+' ms (not a cough)';
    debugEl.textContent='hi +'+j.exHi.toFixed(0)+' dB  lo +'+j.exLo.toFixed(0)+' dB  lo-hi '+(f.lo-f.hi).toFixed(0)+' dB\n'+
      'flat hi '+f.flat.toFixed(2)+'  flat lo '+f.flatLo.toFixed(2)+'\n'+
      'now: '+(j.slurp?'SLURP':j.blow?'BLOW':det.burst?'burst…':j.loud?'sound':'quiet')+'   coughs: '+dbgCoughs+'\n'+(dbgLast||'');
  }

  function paintStatic(){
    [].forEach.call(document.querySelectorAll('[data-en]'),function(el){if(el.dataset.vi===undefined)el.dataset.vi=el.textContent;el.textContent=lang==='en'?el.dataset.en:el.dataset.vi;});
    [].forEach.call(document.querySelectorAll('[data-en-label]'),function(el){if(el.dataset.viLabel===undefined)el.dataset.viLabel=el.getAttribute('aria-label');el.setAttribute('aria-label',lang==='en'?el.dataset.enLabel:el.dataset.viLabel);});
    [].forEach.call(document.querySelectorAll('.lang button'),function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-lang')===lang));});
    document.documentElement.lang=lang;
    var lb=$('langbtn');lb.textContent=lang.toUpperCase();lb.setAttribute('aria-label',lang==='en'?'Tiếng Việt':'English');
  }
  /* switching language redraws every visible word in place; a bowl in progress keeps going */
  function applyLang(l){
    lang=l==='en'?'en':'vi';store.lang=lang;save();
    paintStatic();paintSound();paintTheme();paintStart();paintDish();showBest();hud();
    var ct=document.querySelector('#vessel text');if(ct)ct.textContent=tx('SẠCH!','CLEAN!');
    if(!result.hidden)paintResult();
    if(done)say(tx('Sạch tô!','Bowl cleaned!'));else if(!started)say(elapsed>0?pausedText():idleText());
    if(micOn&&calibrating)$('mstate').textContent=tx('đo tiếng ồn…','measuring noise…');
    Menu.relang();DISHES.forEach(function(q){paintBest(q);});markItems();
    Duel.paint();
  }
  [].forEach.call(document.querySelectorAll('.lang button'),function(b){b.addEventListener('click',function(){applyLang(b.getAttribute('data-lang'));});});
  $('langbtn').addEventListener('click',function(){applyLang(lang==='en'?'vi':'en');});
  /* a Thách đấu link (#phong=ABC123) drops you into your friend's room; the code is cleared so a reload doesn't rejoin */
  function joinFromLink(){
    var m=/(?:^#|&)phong=([A-Za-z0-9]{6})(?:&|$)/.exec(location.hash||'');if(!m)return;
    try{history.replaceState(null,'',location.href.split('#')[0]);}catch(e){}
    Duel.join(m[1].toUpperCase());
  }
  window.addEventListener('hashchange',function(){if(!bookOpen)joinFromLink();});
  function start(data){
    paintStatic();
    buildBoard();
    if(typeof data.cur==='number'&&data.cur>=0&&data.cur<DISHES.length)pick(data.cur,!!data.daily);else pick(dailyIdx,true);
    joinFromLink();
    requestAnimationFrame(tick);
  }
  var hot=window.claude&&window.claude.hot;
  if(hot&&hot.snapshot)hot.snapshot(function(){return {cur:cur,daily:isDaily};});
  if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
